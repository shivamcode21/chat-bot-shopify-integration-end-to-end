<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Product Chat Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #00d9ff;
    }
    .setting {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #a0a0a0;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f1a;
      color: #fff;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #00d9ff;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .toggle {
      position: relative;
      width: 50px;
      height: 26px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: 0.3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00d9ff;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .status.success {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
    }
    .status.error {
      background: rgba(255, 68, 68, 0.1);
      color: #ff4444;
    }
  </style>
</head>
<body>
  <h1>🛒 Product Chat Demo</h1>
  
  <div class="setting">
    <label>Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8001">
  </div>
  
  <div class="setting">
    <label>Client ID (store UUID for product search)</label>
    <input type="text" id="clientId" placeholder="e.g. a1b2c3d4-...">
  </div>

  <div class="setting">
    <label>OpenAI API Key (optional - uses backend key if empty)</label>
    <input type="text" id="apiKey" placeholder="sk-...">
  </div>
  
  <div class="toggle-container">
    <span>Enable Chat Widget</span>
    <label class="toggle">
      <input type="checkbox" id="enableWidget" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <button id="saveBtn">Save Settings</button>
  <button id="testBtn" style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);">Test Connection</button>
  
  <div id="status" class="status" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>

<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Launcher theme palette preview">
  <rect width="1200" height="520" fill="#f6f1ed"/>

  <text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2b211c">
    Launcher Theme Options
  </text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="15" fill="#6f625b">
    Suggested running-text pill backgrounds for client-specific widget themes
  </text>

  <!-- Card 1 -->
  <g transform="translate(60 120)">
    <rect x="0" y="0" width="320" height="320" rx="28" fill="#ffffff" stroke="#e7ddd6"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2d27">Terracotta Nude</text>
    <rect x="24" y="64" width="272" height="70" rx="22" fill="url(#grad1)"/>
    <text x="48" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Show me new arrivals</text>
    <rect x="24" y="162" width="78" height="78" rx="18" fill="#B8644A"/>
    <rect x="121" y="162" width="78" height="78" rx="18" fill="#D98B73"/>
    <rect x="218" y="162" width="78" height="78" rx="18" fill="#EBC4B3"/>
    <text x="24" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#B8644A</text>
    <text x="121" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#D98B73</text>
    <text x="218" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#EBC4B3</text>
    <text x="24" y="302" font-family="Arial, sans-serif" font-size="14" fill="#7a6d65">Warm, premium, shapewear-aligned</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(440 120)">
    <rect x="0" y="0" width="320" height="320" rx="28" fill="#ffffff" stroke="#e7ddd6"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2d27">Mocha Rose</text>
    <rect x="24" y="64" width="272" height="70" rx="22" fill="url(#grad2)"/>
    <text x="48" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Track my order</text>
    <rect x="24" y="162" width="78" height="78" rx="18" fill="#6F4A52"/>
    <rect x="121" y="162" width="78" height="78" rx="18" fill="#9C6B73"/>
    <rect x="218" y="162" width="78" height="78" rx="18" fill="#D7A7A0"/>
    <text x="24" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#6F4A52</text>
    <text x="121" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#9C6B73</text>
    <text x="218" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#D7A7A0</text>
    <text x="24" y="302" font-family="Arial, sans-serif" font-size="14" fill="#7a6d65">Editorial, elegant, fashion-led</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(820 120)">
    <rect x="0" y="0" width="320" height="320" rx="28" fill="#ffffff" stroke="#e7ddd6"/>
    <text x="24" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#3a2d27">Cocoa Sand</text>
    <rect x="24" y="64" width="272" height="70" rx="22" fill="url(#grad3)"/>
    <text x="48" y="106" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Find your fit</text>
    <rect x="24" y="162" width="78" height="78" rx="18" fill="#7A5A46"/>
    <rect x="121" y="162" width="78" height="78" rx="18" fill="#B3876B"/>
    <rect x="218" y="162" width="78" height="78" rx="18" fill="#E3C7B1"/>
    <text x="24" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#7A5A46</text>
    <text x="121" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#B3876B</text>
    <text x="218" y="270" font-family="Courier New, monospace" font-size="14" fill="#5a4a42">#E3C7B1</text>
    <text x="24" y="302" font-family="Arial, sans-serif" font-size="14" fill="#7a6d65">Soft luxe, earthy, intimatewear</text>
  </g>

  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8644A"/>
      <stop offset="45%" stop-color="#D98B73"/>
      <stop offset="100%" stop-color="#EBC4B3"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F4A52"/>
      <stop offset="50%" stop-color="#9C6B73"/>
      <stop offset="100%" stop-color="#D7A7A0"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5A46"/>
      <stop offset="48%" stop-color="#B3876B"/>
      <stop offset="100%" stop-color="#E3C7B1"/>
    </linearGradient>
  </defs>
</svg>

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommagents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecommagents_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommagents
    depends_on:
      - db

volumes:
  ecommagents_pgdata:
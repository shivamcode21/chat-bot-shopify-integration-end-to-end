            function findFirstVisibleProduct() {
                const addBtn = document.querySelector('.product-card .product-card-btn.add-cart');
                if (!addBtn) return null;
                const card = addBtn.closest('.product-card');
                const titleEl = card ? card.querySelector('.product-card-title') : null;
                return {
                    title: titleEl ? (titleEl.textContent || '').trim() : '',
                    handle: addBtn.getAttribute('data-handle') || '',
                    variantId: addBtn.getAttribute('data-variant') || '',
                    url: card ? (card.dataset.productUrl || '') : '',
                    productImage: card ? (card.dataset.productImage || '') : '',
                };
            }

            function addFirstVisibleProductToCart(quantity = 1) {
                const first = findFirstVisibleProduct();
                if (!first) {
                    showToast('No product selected', 'error');
                    return;
                }
                addToCart(
                    first.handle,
                    first.variantId,
                    { disabled: false, textContent: 'Add', classList: { add: () => {} } },
                    { title: first.title, price: '', url: first.url || '', productImage: first.productImage || '' },
                    quantity
                );
            }

            function addVisibleProductByIndex(index, quantity = 1) {
                const carousels = Array.from(document.querySelectorAll('.product-carousel'));
                const latestCarousel = carousels.length ? carousels[carousels.length - 1] : null;
                const cards = latestCarousel
                    ? Array.from(latestCarousel.querySelectorAll('.product-card'))
                    : Array.from(document.querySelectorAll('.product-card'));
                const idx = parseInt(index, 10) - 1;
                if (idx < 0 || idx >= cards.length) {
                    showToast('That product selection is not available right now.', 'error');
                    return;
                }
                const card = cards[idx];
                const addBtn = card.querySelector('.product-card-btn.add-cart');
                if (!addBtn) {
                    showToast('That product cannot be added right now.', 'error');
                    return;
                }
                addToCart(
                    addBtn.getAttribute('data-handle') || '',
                    addBtn.getAttribute('data-variant') || '',
                    { disabled: false, textContent: 'Add', classList: { add: () => {} } },
                    {
                        title: card.dataset.productTitle || '',
                        price: card.dataset.productPrice || '',
                        url: card.dataset.productUrl || '',
                        productImage: card.dataset.productImage || '',
                    },
                    quantity
                );
            }

            function findVisibleProductByName(query) {
                const q = (query || '').toLowerCase().trim();
                if (!q) return null;
                const cards = Array.from(document.querySelectorAll('.product-card'));
                for (const card of cards) {
                    const titleEl = card.querySelector('.product-card-title');
                    const addBtn = card.querySelector('.product-card-btn.add-cart');
                    if (!titleEl || !addBtn) continue;
                    const title = (titleEl.textContent || '').trim();
                    if (!title) continue;
                    if (title.toLowerCase().includes(q) || q.includes(title.toLowerCase())) {
                        return {
                            title,
                            handle: addBtn.getAttribute('data-handle') || '',
                            variantId: addBtn.getAttribute('data-variant') || '',
                            url: card.dataset.productUrl || '',
                            productImage: card.dataset.productImage || '',
                        };
                    }
                }
                return null;
            }

            function addProductToCartByName(query, quantity = 1) {
                const matched = findVisibleProductByName(query);
                if (!matched) {
                    showToast('Could not find that product in recent results', 'error');
                    return;
                }
                addToCart(
                    matched.handle,
                    matched.variantId,
                    { disabled: false, textContent: 'Add', classList: { add: () => {} } },
                    { title: matched.title, price: '', url: matched.url || '', productImage: matched.productImage || '' },
                    quantity
                );
            }

            // ═══════════════════════════════════════════════════════════════
            // TOAST NOTIFICATIONS
            // ═══════════════════════════════════════════════════════════════
            function showToast(message, type = 'info') {
                // Remove existing toast
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    existingToast.style.animation = 'toastOut 0.2s ease-out';
                    setTimeout(() => existingToast.remove(), 200);
                }

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);

                // Auto-remove after 3 seconds with fade-out
                setTimeout(() => {
                    toast.style.animation = 'toastOut 0.2s ease-out';
                    setTimeout(() => toast.remove(), 200);
                }, 3000);
            }

            // ═══════════════════════════════════════════════════════════════
            // WEBSOCKET CONNECTION
            // ═══════════════════════════════════════════════════════════════
            function connectionStatusText(state) {
                if (state === 'reconnecting') return socketEverOpened ? 'Reconnecting...' : 'Connecting...';
                if (state === 'disconnected') return 'Connection disconnected';
                if (state === 'offline') return 'Offline';
                if (state === 'error') return 'Connection issue';
                return 'Online';
            }

            function connectionToastText(state) {
                if (state === 'reconnecting') return socketEverOpened ? 'Reconnecting...' : 'Connecting...';
                if (state === 'disconnected') return 'Connection disconnected';
                if (state === 'offline') return 'You appear to be offline';
                if (state === 'error') return 'Connection issue detected';
                return socketEverOpened ? 'You are back online' : 'Connected';
            }

            function setConnectionStatus(state, options = {}) {
                const nextState = state || 'online';
                const text = options.text || connectionStatusText(nextState);
                const changed = connectionState !== nextState;
                connectionState = nextState;

                const statusEl = document.querySelector('.online-status');
                if (statusEl) {
                    let dotEl = statusEl.querySelector('.status-dot');
                    if (!dotEl) {
                        dotEl = document.createElement('span');
                        dotEl.className = 'status-dot';
                    }
                    statusEl.className = `online-status status-${nextState}`;
                    statusEl.textContent = '';
                    statusEl.appendChild(dotEl);
                    statusEl.appendChild(document.createTextNode(text));
                }

                if (options.toast && (changed || options.forceToast)) {
                    const toastType = nextState === 'online' ? 'success' : (nextState === 'reconnecting' ? 'info' : 'error');
                    showToast(options.toastMessage || connectionToastText(nextState), toastType);
                }
            }

            function markRecoveryNoticePending() {
                if (socketEverOpened) {
                    recoveryNoticePending = true;
                }
            }

            function getClientDisconnectPhase() {
                const messagesDiv = document.getElementById('messages');
                const typingVisible = !!(messagesDiv && messagesDiv.querySelector('.typing'));
                const streaming = !!streamingMessageDiv;
                if (streaming) return 'streaming_response';
                if (typingVisible) return 'waiting_for_bot_response';
                if (messageQueue.length > 0) return 'queued_payload';
                if (!isBrowserOnline()) return 'browser_offline';
                if (!isPageVisible()) return 'page_hidden';
                return 'idle';
            }

            function logSocketDisconnectContext(reason, event = {}) {
                const context = {
                    reason: reason || 'unknown',
                    phase: getClientDisconnectPhase(),
                    sessionId: sessionId,
                    closeCode: event && event.code ? event.code : null,
                    closeReason: event && event.reason ? String(event.reason) : '',
                    queuedPayloads: messageQueue.length,
                    reconnectAttempts: reconnectAttempts,
                    pageVisible: isPageVisible(),
                    browserOnline: isBrowserOnline(),
                    timestamp: new Date().toISOString()
                };
                console.error('[FashionBot] WebSocket disconnected context', context);
            }

            function isPageVisible() {
                return typeof document === 'undefined' || document.visibilityState !== 'hidden';
            }

            function isBrowserOnline() {
                return typeof navigator === 'undefined' || navigator.onLine !== false;
            }

            function clearReconnectTimer() {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            }

            function clearWsConnectTimer() {
                if (wsConnectTimer) {
                    clearTimeout(wsConnectTimer);
                    wsConnectTimer = null;
                }
            }

            function shouldDeferReconnect(force) {
                return !force && (!isPageVisible() || !isBrowserOnline());
            }

            function handleBrowserOnline() {
                if (websocketFatalRejectReason) return;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    reconnectPendingUntilVisible = false;
                    recoveryNoticePending = false;
                    clearReconnectTimer();
                    setConnectionStatus('online', { toast: true, forceToast: true, toastMessage: 'You are back online' });
                    processMessageQueue();
                    return;
                }
                reconnectPendingUntilVisible = true;
                reconnectDelayMs = 1500;
                reconnectAttempts = 0;
                markRecoveryNoticePending();
                setConnectionStatus('reconnecting', { toast: true, forceToast: true, toastMessage: 'Reconnecting...' });
                connect({ force: true, reason: 'online' });
            }

            function connect(options) {
                const opts = options || {};
                if (websocketFatalRejectReason) return;
                if (shouldDeferReconnect(!!opts.force)) {
                    reconnectPendingUntilVisible = true;
                    markRecoveryNoticePending();
                    setConnectionStatus(isBrowserOnline() ? 'disconnected' : 'offline', { toast: socketEverOpened });
                    return;
                }
                // Prefer opaque encoded id, then legacy name lookup, then raw clientId (e.g. UUID-only embeds)
                const wsIdentifier = config.encodedClientId || config.clientName || config.clientId;
                let wsUrl = `${config.apiUrl}/${wsIdentifier}/${sessionId}`;
                if (config.widgetApiKey) {
                    const sep = wsUrl.indexOf('?') === -1 ? '?' : '&';
                    wsUrl += `${sep}api_key=${encodeURIComponent(config.widgetApiKey)}`;
                }
                if (config.embedParentOrigin) {
                    const sep = wsUrl.indexOf('?') === -1 ? '?' : '&';
                    wsUrl += `${sep}embed_parent_origin=${encodeURIComponent(config.embedParentOrigin)}`;
                }
                if (widgetVersion) {
                    const sep = wsUrl.indexOf('?') === -1 ? '?' : '&';
                    wsUrl += `${sep}widget_version=${encodeURIComponent(widgetVersion)}`;
                }
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                    return;
                }
                console.log('Connecting to:', wsUrl);
                if (socketEverOpened || opts.reason) {
                    if (socketEverOpened) markRecoveryNoticePending();
                    setConnectionStatus('reconnecting', { toast: socketEverOpened, forceToast: !!opts.reason && socketEverOpened, toastMessage: 'Reconnecting...' });
                }
                
                ws = new WebSocket(wsUrl);
                const connectingSocket = ws;
                clearWsConnectTimer();
                wsConnectTimer = setTimeout(() => {
                    if (ws === connectingSocket && connectingSocket.readyState === WebSocket.CONNECTING) {
                        console.warn('WebSocket connect timed out; retrying');
                        logSocketDisconnectContext('connect_timeout');
                        try {
                            connectingSocket.close();
                        } catch (closeError) {}
                        if (ws === connectingSocket) {
                            ws = null;
                            scheduleReconnect();
                        }
                    }
                }, WS_CONNECT_TIMEOUT_MS);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    clearWsConnectTimer();
                    const wasRecovering = recoveryNoticePending || (socketEverOpened && connectionState !== 'online');
                    socketEverOpened = true;
                    recoveryNoticePending = false;
                    clearReconnectTimer();
                    reconnectDelayMs = 1500;
                    reconnectAttempts = 0;
                    reconnectPendingUntilVisible = false;
                    connectionClosedByIdleTimeout = false;
                    websocketFatalRejectReason = '';
                    setConnectionStatus('online', { toast: wasRecovering, forceToast: wasRecovering, toastMessage: wasRecovering ? 'You are back online' : 'Connected' });
                    processMessageQueue();
                    startHeartbeat();
                    
                    if (!currentPageContext) {
                        requestPageContext();
                    }
                    captureUserLocation();
                    // Hydrate userPhone from localStorage for v9/v11; defer phone_update until user sends a message (or nudge submit).
                    if (frameUsesPhoneNudgeUi) {
                        try {
                            const stored = getStoredPhone();
                            if (stored && !userPhone) {
                                const d = String(stored).replace(/\D/g, '');
                                if (d.length >= 10) {
                                    userPhone = d.slice(-10);
                                    phoneCollected = true;
                                }
                            }
                        } catch (e) {}
                    }
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (!data || typeof data !== 'object' || !data.type) {
                            console.warn('Ignoring malformed WebSocket payload');
                            return;
                        }
                        handleMessage(data);
                    } catch (parseError) {
                        console.warn('Ignoring invalid WebSocket message:', parseError);
                    }
                };

                ws.onerror = (error) => {
                    clearWsConnectTimer();
                    console.error('WebSocket error:', error);
                    logSocketDisconnectContext('socket_error');
                    markRecoveryNoticePending();
                    setConnectionStatus('disconnected', { toast: socketEverOpened });
                    reconnectPendingUntilVisible = true;
                    scheduleReconnect();
                    try {
                        if (ws && ws.readyState !== WebSocket.CLOSED) ws.close();
                    } catch (closeError) {}
                };
                
                ws.onclose = (event) => {
                    clearWsConnectTimer();
                    const closeCode = event && event.code;
                    const closeReason = event && event.reason ? String(event.reason) : '';
                    console.log('WebSocket closed', closeCode || '', closeReason);
                    pushFaroEvent('ws_disconnect', {
                        code: String(closeCode || 'none'),
                        reason: closeReason || 'none',
                        wasClean: String(event && typeof event.wasClean === 'boolean' ? event.wasClean : false),
                        sessionId: sessionId || 'unknown',
                        clientId: config.clientId || config.encodedClientId || config.clientName || 'unknown',
                        widgetVersion: widgetVersion || 'unknown',
                        phase: getClientDisconnectPhase()
                    });
                    logSocketDisconnectContext('socket_close', event);
                    stopHeartbeat();
                    phoneRelinkSentThisConnection = false;
                    ws = null;
                    if (closeCode === 1008 || /unauthorized|forbidden|origin/i.test(closeReason)) {
                        websocketFatalRejectReason = closeReason || 'policy violation';
                        setConnectionStatus('error', { toast: true, toastMessage: 'Connection rejected' });
                        return;
                    }
                    if (closeCode === 1000 && /idle timeout/i.test(closeReason)) {
                        connectionClosedByIdleTimeout = true;
                        reconnectPendingUntilVisible = false;
                        clearReconnectTimer();
                        setConnectionStatus('disconnected', { toast: false });
                        return;
                    }
                    markRecoveryNoticePending();
                    setConnectionStatus(isBrowserOnline() ? 'disconnected' : 'offline', { toast: socketEverOpened });
                    scheduleReconnect();
                };
            }

            function scheduleReconnect() {
                if (reconnectTimer || websocketFatalRejectReason) return;
                if (!isBrowserOnline() || !isPageVisible()) {
                    reconnectPendingUntilVisible = true;
                    markRecoveryNoticePending();
                    setConnectionStatus(isBrowserOnline() ? 'disconnected' : 'offline', { toast: socketEverOpened });
                    return;
                }
                if (reconnectAttempts >= MAX_AUTO_RECONNECT_ATTEMPTS) {
                    reconnectPendingUntilVisible = true;
                    markRecoveryNoticePending();
                    showTyping(false);
                    setConnectionStatus('disconnected', {
                        toast: true,
                        toastMessage: 'Connection disconnected. Send a message or reopen chat to retry.'
                    });
                    return;
                }
                markRecoveryNoticePending();
                setConnectionStatus('reconnecting', { toast: socketEverOpened, toastMessage: 'Reconnecting...' });
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    reconnectAttempts++;
                    connect();
                    reconnectDelayMs = Math.min(reconnectDelayMs * 2, 30000);
                }, reconnectDelayMs);
            }

            function reconnectIfUseful(reason) {
                if (websocketFatalRejectReason || !isBrowserOnline() || !isPageVisible()) return;
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
                if (messageQueue.length > 0 || reconnectPendingUntilVisible) {
                    reconnectPendingUntilVisible = false;
                    reconnectDelayMs = 1500;
                    reconnectAttempts = 0;
                    connect({ force: true, reason: reason || 'resume' });
                }
            }

            function trySendSocketPayload(payload) {
                if (!payload || !ws || ws.readyState !== WebSocket.OPEN) return false;
                try {
                    ws.send(JSON.stringify(payload));
                    return true;
                } catch (error) {
                    console.warn('WebSocket send failed; will reconnect when useful:', error);
                    markRecoveryNoticePending();
                    setConnectionStatus('disconnected', { toast: socketEverOpened });
                    try {
                        ws.close();
                    } catch (closeError) {}
                    return false;
                }
            }

            // ═══════════════════════════════════════════════════════════════
            // STREAMING STATE
            // ═══════════════════════════════════════════════════════════════
            let streamingMessageDiv = null;  // Current message being streamed
            let streamingContent = '';       // Accumulated streaming content

            function scheduleStreamingFlush() {
                if (streamFlushFrameId) return;
                streamFlushFrameId = requestAnimationFrame(() => {
                    streamFlushFrameId = 0;
                    if (streamingTextEl) {
                        streamingTextEl.textContent = streamingContent;
                    }
                    if (pendingStreamScroll) {
                        const messagesDiv = document.getElementById('messages');
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        pendingStreamScroll = false;
                    }
                });
            }

            function handleMessage(data) {
                if (data.type === 'message') {
                    addMessage(data.message, 'bot');
                    lastBotMessageType = 'message';
                    if (frameUsesPhoneNudgeUi) {
                        botReplyCountV9++;
                        notifyParentBotReplyCountV9();
                    }
                    
                    // Check if message contains product data for carousel
                    if (data.products && data.products.length > 0) {
                        const carousel = renderProductCarousel(data.products);
                        document.getElementById('messages').appendChild(carousel);
                        // Save products to storage for persistence
                        saveProductsToStorage(data.products);
                    }

                    // Show smart follow-up suggestions
                    renderAboveChatButtonGroups();
                    setTimeout(() => showPostQuerySuggestions(data.message), 500);

                } else if (data.type === 'stream') {
                    // Handle streaming token
                    handleStreamToken(data.token);

                } else if (data.type === 'stream_reset') {
                    // Server is retrying after a transient error — discard partial stream
                    if (streamingMessageDiv) {
                        streamingMessageDiv.remove();
                        streamingMessageDiv = null;
                        streamingTextEl = null;
                        streamingContent = '';
                        if (streamFlushFrameId) {
                            cancelAnimationFrame(streamFlushFrameId);
                            streamFlushFrameId = 0;
                        }
                    }
                    
                } else if (data.type === 'stream_end') {
                    // Handle end of streaming
                    handleStreamEnd(data);
                    
                } else if (data.type === 'typing') {
                    showTyping(data.is_typing);
                    // Backend is alive and still working — push the deadline out.
                    if (data.is_typing) pingNoReplyWatchdog();
                } else if (data.type === 'tool') {
                    // Per-tool action label (e.g. "Searching our catalogue") shown
                    // in the typing indicator while the backend tool runs.
                    setTypingActionLabel(data.action);
                    // A tool event proves the backend is alive — reset the deadline.
                    pingNoReplyWatchdog();
                } else if (data.type === 'suggestions') {
                    // Render LLM-guided next-step suggestions as clickable tiles.
                    renderSuggestionTiles(data.suggestions);
                } else if (data.type === 'track_order' || data.type === 'phone_captured') {
                    // Deliver-only signals (no default visual). Re-dispatched on window
                    // so host integrations can hook them without touching the widget.
                    try { window.dispatchEvent(new CustomEvent('fbw:' + data.type, { detail: data })); } catch (_e) {}
                } else if (data.type === 'cart_action_feedback') {
                    const level = (data.level || 'info').toLowerCase();
                    const msg = data.message || '';
                    if (msg) {
                        showToast(msg, level === 'success' ? 'success' : (level === 'error' ? 'error' : 'info'));
                        addMessage(msg, 'bot');
                    }
                } else if (data.type === 'cart_action') {
                    showTyping(false);
                    const action = (data.action || '').toLowerCase();
                    if (data.message && action !== 'show_cart') addMessage(data.message, 'bot');
                    const targetText = (data.target_text || '').trim();
                    const selectionIndex = parseInt(data.selection_index, 10);
                    const useCurrent = !!data.use_current_context;
                    const qty = data.quantity;
                    const qtyDirection = (data.qty_direction || '').toLowerCase();
                    const dispatchVariantId = String(data.variant_id || '').trim();

                    // Backend agent tools dispatch by variant_id directly. When a variant_id
                    // is present and resolvable, prefer it over the older target_text routing.
                    if (dispatchVariantId) {
                        if (action === 'remove') {
                            notifyParent({
                                type: 'fashionbot-remove-from-cart',
                                variantId: dispatchVariantId,
                                productTitle: targetText,
                                targetText: targetText,
                            });
                            showToast('Removing from cart...', 'info');
                            return;
                        }
                        if (action === 'qty') {
                            notifyParent({
                                type: 'fashionbot-update-cart-qty',
                                variantId: dispatchVariantId,
                                productTitle: targetText,
                                targetText: targetText,
                                quantity: qty,
                                qtyDirection: qtyDirection,
                            });
                            showToast(`Updating quantity to ${qty}...`, 'info');
                            return;
                        }
                        if (action === 'add') {
                            notifyParent({
                                type: 'fashionbot-add-to-cart',
                                variantId: dispatchVariantId,
                                quantity: parseInt(qty, 10) || 1,
                                productTitle: targetText,
                            });
                            showToast('Adding to cart...', 'info');
                            return;
                        }
                    }

                    if (action === 'add') {
                        if (selectionIndex) {
                            addVisibleProductByIndex(selectionIndex, qty || 1);
                        } else if (
                            !isOnPdpPage() &&
                            (useCurrent || !targetText) &&
                            renderAddSelectionFormFromLatestCarousel()
                        ) {
                            // Non-PDP generic/current add: show multi-select form from latest carousel.
                        } else if (targetText && !useCurrent) {
                            addProductToCartByName(targetText, qty || 1);
                        } else if (currentPageContext && currentPageContext.productHandle) {
                            addCurrentProductToCart(qty || 1);
                        } else {
                            addFirstVisibleProductToCart(qty || 1);
                        }
                    } else if (action === 'remove') {
                        if (!isOnPdpPage() && renderRemoveSelectionFormFromCart()) {
                            // Non-PDP remove: always list cart items so user can choose exact products.
                        } else if (selectionIndex && latestCartSnapshot && latestCartSnapshot.items && latestCartSnapshot.items[selectionIndex - 1]) {
                            const item = latestCartSnapshot.items[selectionIndex - 1];
                            notifyParent({
                                type: 'fashionbot-remove-from-cart',
                                variantId: item.variant_id,
                                productTitle: item.product_title || item.title || '',
                                targetText: item.product_title || item.title || '',
                            });
                            showToast('Removing from cart...', 'info');
                        } else if (targetText) {
                            removeFromCartByIntent(targetText);
                        } else if (currentPageContext && currentPageContext.productHandle) {
                            removeCurrentProductFromCart();
                        } else if (!targetText) {
                            renderCartSelectionPanel('remove');
                        }
                    } else if (action === 'qty') {
                        if (selectionIndex && latestCartSnapshot && latestCartSnapshot.items && latestCartSnapshot.items[selectionIndex - 1]) {
                            const item = latestCartSnapshot.items[selectionIndex - 1];
                            notifyParent({
                                type: 'fashionbot-update-cart-qty',
                                variantId: item.variant_id,
                                productTitle: item.product_title || item.title || '',
                                targetText: item.product_title || item.title || '',
                                quantity: qty,
                                qtyDirection: qtyDirection,
                            });
                        } else if (targetText && !useCurrent) {
                            updateCartQtyByIntent(qty, targetText, qtyDirection);
                        } else if (currentPageContext && currentPageContext.productHandle) {
                            updateCurrentProductQty(qty, qtyDirection);
                        } else if (!targetText) {
                            renderCartSelectionPanel('qty', { quantity: qty, qtyDirection: qtyDirection });
                        }
                    } else if (action === 'remove_sold_out') {
                        removeSoldOutFromCart();
                    } else if (action === 'show_cart') {
                        requestCartSnapshot('show');
                    } else if (action === 'cart_total') {
                        requestCartSnapshot('total');
                    }
                } else if (data.type === 'phone_required') {
                    showTyping(false);
                    if (frameUsesPhoneNudgeUi) {
                        const titleEl = document.querySelector('.phone-nudge-v9-title');
                        if (titleEl && data.message) {
                            titleEl.textContent = data.message;
                        }
                        setPhoneNudgeErrorV9('');
                        showPhoneNudgeV9UI(true);
                    }
                } else if (data.type === 'error') {
                    if (/unauthorized|forbidden|origin/i.test(data.message || '')) {
                        websocketFatalRejectReason = data.message || 'policy rejection';
                        console.warn('WebSocket rejected by policy:', websocketFatalRejectReason);
                        return;
                    }
                    addMessage(data.message, 'bot');
                } else if (data.type === 'products') {
                    // Async product carousel (follow-up after collection link)
                    const carousel = renderProductCarousel(data.products);
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.appendChild(carousel);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    saveProductsToStorage(data.products);
                }
            }

            function handleStreamToken(token) {
                const messagesDiv = document.getElementById('messages');
                
                // Hide typing indicator when streaming starts
                const typingIndicator = messagesDiv.querySelector('.typing');
                if (typingIndicator) {
                    typingIndicator.parentElement.remove();
                }
                // The reply has started — disarm the no-reply watchdog.
                clearNoReplyWatchdog();
                
                // Create streaming message div if not exists
                if (!streamingMessageDiv) {
                    streamingMessageDiv = document.createElement('div');
                    streamingMessageDiv.className = 'message bot streaming';
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-content';
                    streamingTextEl = document.createElement('span');
                    streamingTextEl.className = 'streaming-text';
                    streamingTextEl.style.whiteSpace = 'pre-wrap';
                    const cursorEl = document.createElement('span');
                    cursorEl.className = 'streaming-cursor';
                    cursorEl.textContent = '▋';
                    contentDiv.appendChild(streamingTextEl);
                    contentDiv.appendChild(cursorEl);
                    
                    streamingMessageDiv.appendChild(contentDiv);
                    messagesDiv.appendChild(streamingMessageDiv);
                    streamingContent = '';
                }
                
                // Accumulate content
                streamingContent += token;
                
                // Update plain streaming text at most once per frame; final formatting happens on stream end.
                pendingStreamScroll = true;
                scheduleStreamingFlush();
            }

            function handleStreamEnd(data) {
                if (streamingMessageDiv) {
                    if (streamFlushFrameId) {
                        cancelAnimationFrame(streamFlushFrameId);
                        streamFlushFrameId = 0;
                    }
                    // Prefer server-authoritative full_response (includes any
                    // post-streaming additions like escalation footers) over
                    // the raw accumulated stream tokens.
                    const authoritative = (data.full_response && typeof data.full_response === 'string')
                        ? data.full_response : streamingContent;
                    // Remove streaming cursor and finalize message
                    const contentDiv = streamingMessageDiv.querySelector('.message-content');
                    contentDiv.innerHTML = formatText(authoritative);
                    
                    // Remove streaming class
                    streamingMessageDiv.classList.remove('streaming');
                    
                    // Save final message to storage
                    saveMessageToStorage(authoritative, 'bot');
                    
                    // Reset streaming state
                    streamingMessageDiv = null;
                    streamingTextEl = null;
                    pendingStreamScroll = false;
                    const finalContent = authoritative;
                    streamingContent = '';
                    lastBotMessageType = 'stream';
                    
                    // Handle products if present
                    if (data.products && data.products.length > 0) {
                        const carousel = renderProductCarousel(data.products);
                        document.getElementById('messages').appendChild(carousel);
                        saveProductsToStorage(data.products);
                    }

                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    
                    // Show suggestions after a short delay
                    renderAboveChatButtonGroups();
                    setTimeout(() => showPostQuerySuggestions(finalContent), 500);

                    if (frameUsesPhoneNudgeUi) {
                        botReplyCountV9++;
                        notifyParentBotReplyCountV9();
                    }
                } else {
                    // Stream ended with no streamed body (empty/aborted stream):
                    // make sure a dangling typing indicator + watchdog don't linger.
                    showTyping(false);
                }
            }

            function sendMessage(customMessage) {
                const input = document.getElementById('message-input');
                const message = customMessage || input.value.trim();
                
                if (!message) return;

                if (frameUsesPhoneNudgeUi && phoneCollectionBlockedV9) {
                    return;
                }

                addMessage(message, 'user');
                input.value = '';
                showTyping(true);
                window.parent.postMessage({ type: 'fashionbot-message-sent', sessionId: sessionId || '' }, '*');
                
                // Remove transient suggestions when user sends a message; keep configured always-on buttons.
                const suggestions = document.querySelectorAll('.suggestions-container:not(.cart-selection-panel)');
                suggestions.forEach(el => {
                    const mode = normalizeButtonDisplayMode(el.getAttribute('data-display-mode') || 'show-at-start');
                    if (mode !== 'always') el.remove();
                });
                // Clear the LLM suggestions block from the previous turn.
                document.querySelectorAll('.suggestions-block, .suggestion-tiles').forEach(el => el.remove());
                renderAboveChatButtonGroups();
                
                const payload = {
                    type: 'message',
                    message: message,
                    phone: userPhone,
                    streaming: true,  // Enable streaming responses
                    timestamp: new Date().toISOString()
                };
                
                if (currentPageContext) {
                    payload.pageContext = currentPageContext;
                }
                if (userLocation) {
                    payload.userLocation = userLocation;
                    payload.clientLocation = userLocation;
                }
                
                if (trySendSocketPayload(payload)) return;
                enqueueSocketPayload(payload);
                connectionClosedByIdleTimeout = false;
                reconnectPendingUntilVisible = false;
                reconnectAttempts = 0;
                reconnectDelayMs = 1500;
                connect({ force: true, reason: 'user_message' });
            }

            function processMessageQueue() {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                pruneMessageQueue();
                while (messageQueue.length > 0 && ws.readyState === WebSocket.OPEN) {
                    const nextEntry = messageQueue.shift();
                    if (Date.now() - getQueuedAt(nextEntry) > QUEUED_PAYLOAD_TTL_MS) {
                        continue;
                    }
                    const nextPayload = getQueuedPayload(nextEntry);
                    if (!trySendSocketPayload(nextPayload)) {
                        messageQueue.unshift(nextEntry);
                        scheduleReconnect();
                        return;
                    }
                }
            }

            function startHeartbeat() {
                stopHeartbeat();
                heartbeatInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        if (!trySendSocketPayload({ type: 'ping', timestamp: new Date().toISOString() })) {
                            scheduleReconnect();
                        }
                    }
                }, 5 * 60 * 1000);
            }

            function stopHeartbeat() {
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                    heartbeatInterval = null;
                }
            }

            // ═══════════════════════════════════════════════════════════════
            // STORAGE FUNCTIONS
            // ═══════════════════════════════════════════════════════════════
            function saveMessageToStorage(text, sender, timestamp) {
                try {
                    const storageKey = getMessagesStorageKey();
                    let messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    
                    messages.push({
                        type: 'message',
                        text: sanitizeForStorage(text),
                        sender: sender,
                        timestamp: timestamp || new Date().toISOString()
                    });
                    
                    if (messages.length > CHAT_HISTORY_SAVE_CAP) {
                        messages = messages.slice(-CHAT_HISTORY_SAVE_CAP);
                    }
                    
                    localStorage.setItem(storageKey, JSON.stringify(messages));
                } catch (e) {
                    console.error('Failed to save message:', e);
                }
            }

            function saveProductsToStorage(products) {
                try {
                    const storageKey = getMessagesStorageKey();
                    let messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    
                    messages.push({
                        type: 'products',
                        products: products,
                        timestamp: new Date().toISOString()
                    });
                    
                    if (messages.length > CHAT_HISTORY_SAVE_CAP) {
                        messages = messages.slice(-CHAT_HISTORY_SAVE_CAP);
                    }
                    
                    localStorage.setItem(storageKey, JSON.stringify(messages));
                } catch (e) {
                    console.error('Failed to save products:', e);
                }
            }

            function sanitizeForStorage(text) {
                if (typeof text !== 'string') return '';
                return text
                    .replace(/<script[^>]*>.*?<\/script>/gi, '')
                    .replace(/<iframe[^>]*>.*?<\/iframe>/gi, '')
                    .replace(/javascript:/gi, '')
                    .replace(/on\w+\s*=/gi, '');
            }

            /**
             * Keep only the latest cart snapshot per Shopify cart token (preserves message order).
             */
            function dedupeCartSnapshotsByToken(messages) {
                const lastIdxByToken = new Map();
                messages.forEach((msg, i) => {
                    if (msg && msg.type === 'cart' && msg.cart && msg.cart.token) {
                        lastIdxByToken.set(String(msg.cart.token), i);
                    }
                });
                return messages.filter((msg, i) => {
                    if (!msg || msg.type !== 'cart' || !msg.cart || !msg.cart.token) return true;
                    const t = String(msg.cart.token);
                    return lastIdxByToken.get(t) === i;
                });
            }

            function getMessagesStorageKey() {
                if (widgetVersionNumber >= 55) {
                    return `fashionbot_messages:${getStorageScope()}`;
                }
                return getLegacyMessagesStorageKey();
            }

            function getLegacyMessagesStorageKey() {
                const safeSessionId = normalizeStoragePart(sessionId || config.sessionId, 'unknown-session');
                return `fashionbot_messages:${getStorageScope()}:${safeSessionId}`;
            }

            function mergeStoredHistory(primaryMessages, legacyMessages) {
                const combined = []
                    .concat(Array.isArray(primaryMessages) ? primaryMessages : [])
                    .concat(Array.isArray(legacyMessages) ? legacyMessages : []);
                const seen = new Set();
                return combined.filter(msg => {
                    if (!msg || typeof msg !== 'object') return false;
                    const key = [
                        msg.type || 'message',
                        msg.sender || '',
                        msg.timestamp || '',
                        msg.text || '',
                        msg.cart && msg.cart.token ? msg.cart.token : '',
                        Array.isArray(msg.products) ? msg.products.map(p => p && (p.handle || p.url || p.title || p.name || '')).join('|') : ''
                    ].join('::');
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                }).sort((a, b) => {
                    const at = new Date(a.timestamp || 0).getTime();
                    const bt = new Date(b.timestamp || 0).getTime();
                    return (Number.isFinite(at) ? at : 0) - (Number.isFinite(bt) ? bt : 0);
                });
            }

            function pruneStoredMessages(messages) {
                const safeMessages = Array.isArray(messages) ? messages : [];
                const cutoffMs = Date.now() - 48 * 60 * 60 * 1000;
                const filtered = safeMessages.filter(msg => {
                    if (!msg || !msg.timestamp) return false;
                    const ts = new Date(msg.timestamp).getTime();
                    return Number.isFinite(ts) && ts > cutoffMs;
                });
                const deduped = dedupeCartSnapshotsByToken(filtered);
                const capped = deduped.length > CHAT_HISTORY_SAVE_CAP
                    ? deduped.slice(-CHAT_HISTORY_SAVE_CAP)
                    : deduped;
                const needsCleanup =
                    capped.length !== safeMessages.length ||
                    deduped.length !== filtered.length ||
                    deduped.length > CHAT_HISTORY_SAVE_CAP;
                return { recent: capped, needsCleanup };
            }

            function scheduleHistoryCleanupPersist() {
                if (historyCleanupScheduled || !sessionId) return;
                historyCleanupScheduled = true;
                const runCleanup = function() {
                    historyCleanupScheduled = false;
                    try {
                        const storageKey = getMessagesStorageKey();
                        const currentMessages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                        const { recent, needsCleanup } = pruneStoredMessages(currentMessages);
                        if (needsCleanup) {
                            localStorage.setItem(storageKey, JSON.stringify(recent));
                        }
                    } catch (e) {
                        console.error('Failed to persist cleaned message history:', e);
                    }
                };
                if (typeof window.requestIdleCallback === 'function') {
                    window.requestIdleCallback(runCleanup, { timeout: 1200 });
                } else {
                    setTimeout(runCleanup, 250);
                }
            }

            function loadMessagesFromStorage() {
                try {
                    const storageKey = getMessagesStorageKey();
                    let messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    const legacyStorageKey = getLegacyMessagesStorageKey();
                    if (widgetVersionNumber >= 55 && legacyStorageKey !== storageKey) {
                        const legacyMessages = JSON.parse(localStorage.getItem(legacyStorageKey) || '[]');
                        if (Array.isArray(legacyMessages) && legacyMessages.length > 0) {
                            messages = mergeStoredHistory(messages, legacyMessages);
                            const { recent } = pruneStoredMessages(messages);
                            localStorage.setItem(storageKey, JSON.stringify(recent));
                        }
                    }
                    const { recent, needsCleanup } = pruneStoredMessages(messages);
                    cachedHistoryMessages = recent;
                    if (needsCleanup) {
                        scheduleHistoryCleanupPersist();
                    }
                    return recent;
                } catch (e) {
                    console.error('Failed to load messages:', e);
                    cachedHistoryMessages = [];
                    return [];
                }
            }

            /**
             * Append one stored history item. insertBeforeNode null = append to end.
             * @returns Root DOM node inserted, or null.
             */
            function appendHistoryItemToMessages(item, insertBeforeNode) {
                const messagesDiv = document.getElementById('messages');
                if (item.type === 'products' && item.products) {
                    const carousel = renderProductCarousel(item.products);
                    if (insertBeforeNode) messagesDiv.insertBefore(carousel, insertBeforeNode);
                    else messagesDiv.appendChild(carousel);
                    return carousel;
                }
                if (item.type === 'cart' && item.cart) {
                    return renderCartMessage(item.cart, insertBeforeNode, true);
                }
                if (item.text) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${item.sender}`;
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-content';
                    contentDiv.innerHTML = formatText(item.text);
                    messageDiv.appendChild(contentDiv);
                    if (insertBeforeNode) messagesDiv.insertBefore(messageDiv, insertBeforeNode);
                    else messagesDiv.appendChild(messageDiv);
                    return messageDiv;
                }
                return null;
            }

            function scheduleHistoryRestore() {
                if (historyRestored || historyRestoreScheduled) return;
                historyRestoreScheduled = true;
                const runRestore = function() {
                    historyRestoreScheduled = false;
                    restoreChatHistory();
                };
                requestAnimationFrame(function() {
                    if (typeof window.requestIdleCallback === 'function') {
                        window.requestIdleCallback(runRestore, { timeout: 500 });
                    } else {
                        setTimeout(runRestore, 0);
                    }
                });
            }

            function restoreChatHistory() {
                if (historyRestored) return;

                const all = loadMessagesFromStorage();
                if (all.length === 0) return;

                historyWindowStart = Math.max(0, all.length - CHAT_HISTORY_RECENT_WINDOW);
                const slice = all.slice(historyWindowStart);
                const messagesDiv = document.getElementById('messages');

                const tailLen = Math.min(CHAT_HISTORY_FIRST_PAINT, slice.length);
                const tail = slice.slice(-tailLen);
                const head = slice.length > tailLen ? slice.slice(0, slice.length - tailLen) : [];

                let tailIdx = 0;
                let tailFirstNode = null;

                function finalizeRestore(topMessageNode) {
                    removeInitialSuggestions();
                    historyFirstMessageNode = topMessageNode || messagesDiv.firstChild;

                    const oldestItem = all[historyWindowStart];
                    const timeAgo = getTimeAgo(new Date(oldestItem.timestamp));
                    const separator = document.createElement('div');
                    separator.className = 'history-separator';
                    const truncated = all.length > CHAT_HISTORY_RECENT_WINDOW;
                    separator.innerHTML = truncated
                        ? `— Previous conversation (${timeAgo}) — <span style="opacity:.85">(showing recent messages)</span>`
                        : `— Previous conversation (${timeAgo}) —`;
                    messagesDiv.insertBefore(separator, messagesDiv.firstChild);

                    if (historyWindowStart > 0) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'fbw-load-earlier';
                        btn.textContent = 'Load earlier messages';
                        btn.addEventListener('click', onLoadEarlierHistoryClick);
                        messagesDiv.insertBefore(btn, separator);
                        historyLoadEarlierBtnEl = btn;
                    }

                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    historyRestored = true;
                    renderAboveChatButtonGroups();
                    if (shouldShowHistoryButtons()) {
                        showContextSuggestions();
                    }
                }

                function pumpTail() {
                    const end = Math.min(tailIdx + CHAT_HISTORY_RESTORE_BATCH, tail.length);
                    for (; tailIdx < end; tailIdx++) {
                        const node = appendHistoryItemToMessages(tail[tailIdx], null);
                        if (tailIdx === 0 && node) tailFirstNode = node;
                    }
                    if (tailIdx < tail.length) {
                        requestAnimationFrame(pumpTail);
                        return;
                    }
                    if (head.length === 0) {
                        finalizeRestore(tailFirstNode);
                        return;
                    }
                    const schedulePreload =
                        typeof window.requestIdleCallback === 'function'
                            ? function (cb) {
                                  window.requestIdleCallback(cb, { timeout: 400 });
                              }
                            : function (cb) {
                                  setTimeout(cb, 0);
                              };
                    schedulePreload(function () {
                        let headIdx = 0;
                        let headFirstNode = null;
                        const anchor = tailFirstNode;

                        function pumpHead() {
                            const headEnd = Math.min(headIdx + CHAT_HISTORY_RESTORE_BATCH, head.length);
                            for (; headIdx < headEnd; headIdx++) {
                                const node = appendHistoryItemToMessages(head[headIdx], anchor);
                                if (headIdx === 0 && node) headFirstNode = node;
                            }
                            if (headIdx < head.length) {
                                requestAnimationFrame(pumpHead);
                                return;
                            }
                            finalizeRestore(headFirstNode || tailFirstNode);
                        }

                        requestAnimationFrame(pumpHead);
                    });
                }

                requestAnimationFrame(pumpTail);
            }

            function onLoadEarlierHistoryClick() {
                const btn = historyLoadEarlierBtnEl;
                if (!btn || btn.disabled) return;
                const all = cachedHistoryMessages;
                if (historyWindowStart <= 0 || all.length === 0) return;

                const anchor = historyFirstMessageNode;
                if (!anchor) return;

                const messagesDiv = document.getElementById('messages');
                const scrollHeightBefore = messagesDiv.scrollHeight;
                const scrollTopBefore = messagesDiv.scrollTop;

                btn.disabled = true;
                const newStart = Math.max(0, historyWindowStart - CHAT_HISTORY_LOAD_CHUNK);
                const chunk = all.slice(newStart, historyWindowStart);

                let i = 0;
                let newFirstRoot = null;

                function pumpEarlier() {
                    const end = Math.min(i + CHAT_HISTORY_RESTORE_BATCH, chunk.length);
                    for (; i < end; i++) {
                        const node = appendHistoryItemToMessages(chunk[i], anchor);
                        if (i === 0 && node) newFirstRoot = node;
                    }
                    if (i < chunk.length) {
                        requestAnimationFrame(pumpEarlier);
                        return;
                    }
                    if (newFirstRoot) {
                        historyFirstMessageNode = newFirstRoot;
                    }
                    historyWindowStart = newStart;
                    if (historyWindowStart <= 0 && historyLoadEarlierBtnEl) {
                        historyLoadEarlierBtnEl.remove();
                        historyLoadEarlierBtnEl = null;
                    } else {
                        btn.disabled = false;
                    }
                    messagesDiv.scrollTop =
                        scrollTopBefore + (messagesDiv.scrollHeight - scrollHeightBefore);
                }

                requestAnimationFrame(pumpEarlier);
            }

            function getTimeAgo(date) {
                const seconds = Math.floor((new Date() - date) / 1000);
                if (seconds < 60) return 'just now';
                if (seconds < 3600) return `${Math.floor(seconds / 60)} minutes ago`;
                if (seconds < 86400) return `${Math.floor(seconds / 3600)} hours ago`;
                return `${Math.floor(seconds / 86400)} days ago`;
            }

            // ═══════════════════════════════════════════════════════════════
            // UI FUNCTIONS
            // ═══════════════════════════════════════════════════════════════
            function formatText(text) {
                const escapeHtml = (unsafe) => unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
                
                // Check if this is a size chart response
                const sizeChartTable = formatSizeChart(text);
                if (sizeChartTable) {
                    return sizeChartTable;
                }
                
                // Product list formatting:
                // - numbered product title lines should keep plain product names, not hyperlinks
                // - product CTA lines should render as hyperlinked "Explore Product"
                // - drop redundant "Link:" labels on CTA bullets
                // - NEVER rewrite checkout / payment links — those must keep their original text
                const _isCheckoutUrl = (u) => /\/checkout|\/cart(?:[\/?#]|$)|\/pay|\/invoices\/|draft_order/i.test(u);
                const _isMapsUrl = (u) => {
                    try {
                        const parsed = new URL(u, window.location.href);
                        const host = (parsed.hostname || '').toLowerCase();
                        if (host === 'maps.app.goo.gl') return true;
                        if (host === 'goo.gl' || host === 'maps.google.com') {
                            return /maps/i.test((parsed.pathname || '') + (parsed.hostname || ''));
                        }
                        return host.includes('google.') && /\/maps(?:\/|$)/i.test(parsed.pathname || '');
                    } catch (e) {
                        return /(?:google\.[^/\s]+\/maps|maps\.google\.|maps\.app\.goo\.gl)/i.test(String(u || ''));
                    }
                };
                const _isProductUrl = (u) => {
                    try {
                        const parsed = new URL(u, window.location.href);
                        return /\/products\/[^/?#]+/i.test(parsed.pathname || '');
                    } catch (e) {
                        return /\/products\/[^/?#]+/i.test(String(u || ''));
                    }
                };
                let t = text;
                t = t.replace(/\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, function(m, _txt, url) {
                    return _isMapsUrl(url) ? '[Find Location](' + url + ')' : m;
                });
                t = t.replace(/^(\s*\d+\.\s*)\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)(\s*[-–—]\s*)/gim, '$1$2$4');
                t = t.replace(/\[\s*View\s+Product\s*\]\((https?:\/\/[^)\s]+)\)/gi, function(m, url) {
                    return _isProductUrl(url) && !_isCheckoutUrl(url) ? '[Explore Product](' + url + ')' : m;
                });
                t = t.replace(/^(\s*[-*]\s*)\[[^\]]+\]\((https?:\/\/[^)\s]+)\)\s*$/gim, function(m, pre, url) {
                    return _isProductUrl(url) && !_isCheckoutUrl(url) ? pre + '[Explore Product](' + url + ')' : m;
                });
                t = t.replace(/^(\s*)\[[^\]]+\]\((https?:\/\/[^)\s]+)\)\s*$/gim, function(m, pre, url) {
                    return _isProductUrl(url) && !_isCheckoutUrl(url) ? pre + '[Explore Product](' + url + ')' : m;
                });
                t = t.replace(/^(\s*[-*]\s*)Link:\s*(\[Explore Product\]\()/gim, '$1$2');
                t = t.replace(/\*\*Link:\*\*\s*(\[Explore Product\]\()/gi, '$1');
                // Normalize recommendation responses so the numbered product line stays plain text,
                // while product follow-up CTAs render as separate "Explore Product" links.
                t = t.replace(/^(\s*\d+\.\s*)\[\s*([^\]]+?)\s*\]\((https?:\/\/[^)\s]+)\)/gim, '$1$2');
                t = t.replace(/^(\s*(?:[-*]\s*)?)\[\s*(?!Explore Product\s*\])([^\]]+?)\s*\]\((https?:\/\/[^)\s]+)\)\s*$/gim, function(m, pre, _txt, url) {
                    return _isProductUrl(url) && !_isCheckoutUrl(url) ? pre + '[Explore Product](' + url + ')' : m;
                });
                const numberedProductRows = t.match(/^\s*\d+\.\s+.+$/gim) || [];
                const pricedRows = numberedProductRows.filter(row => /(?:₹|Rs\.?|INR|\$|€|£)\s*[\d,.]+|[\d,.]+\s*(?:INR|USD|EUR|GBP)\b/i.test(row));
                const looksLikeProductList = numberedProductRows.length >= 2 && pricedRows.length >= 2;
                if (looksLikeProductList) {
                    // Give recommendation rows breathing room without changing ordinary numbered instructions.
                    t = t.replace(/\n(?!\n)(\s*(?:[2-9]|\d{2,})\.\s+)/g, '\n\n$1');
                }

                let formatted = escapeHtml(t);
                // Product photos belong in the carousel (image_url from WebSocket). If the model emits ![alt](url), render a link — not <img> (avoids autolink mangling chat HTML).
                formatted = formatted.replace(
                    /!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/gi,
                    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
                );
                formatted = formatted.replace(/!\[([^\]]+)\](?!\()/g, '$1');
                // Inline emphasis runs AFTER links are resolved and parked (below).
                // A URL can legitimately contain underscores (e.g. ?cp_id=..&security_key=..)
                // and the _.._ / *..* rules would otherwise rewrite the middle of one
                // as <em>, corrupting the href and truncating the link.
                formatted = formatted.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                // Bare URLs → links; skip href=" / src=" (attribute values) and URLs right after ""> (link text that duplicates the URL — avoids nested <a> and broken DOM).
                // Use (?:...) so the replace callback gets (match, offset, str); a capturing group would shift args and break the lookbacks.
                formatted = formatted.replace(/(?:https?:\/\/[^\s<"]+)/g, function (match, offset, str) {
                    if (offset >= 6 && str.slice(offset - 6, offset) === 'href="') return match;
                    if (offset >= 5 && str.slice(offset - 5, offset) === 'src="') return match;
                    if (offset >= 2 && str.slice(offset - 2, offset) === '">') return match;
                    // Sentence punctuation directly after a URL is not part of it.
                    // Leaving it in the href sends the trailing character to the
                    // server as query data -- a tracking security_key ending in
                    // ')' or '.' is rejected, and the customer gets "shipment not
                    // found" from a link that looks right on screen.
                    //
                    // A closing bracket is trimmed only when the URL never opened
                    // one, because both shapes occur: a bracket pair can belong to
                    // the URL (…/Foo_(bar)), and a URL is often written inside one
                    // ("Parcel 1 (track: https://…)"). Counting tells them apart.
                    // Looped so a URL ending both ways ("(see https://…).") is
                    // trimmed back in either order.
                    let trail = '';
                    let trimmed = true;
                    while (trimmed) {
                        trimmed = false;
                        const punct = match.match(/[.,;:!?'"]+$/);
                        if (punct) {
                            trail = punct[0] + trail;
                            match = match.slice(0, match.length - punct[0].length);
                            trimmed = true;
                        }
                        const closer = match.slice(-1);
                        if (closer === ')' || closer === ']') {
                            const opener = closer === ')' ? '(' : '[';
                            const opens = match.split(opener).length - 1;
                            const closes = match.split(closer).length - 1;
                            if (closes > opens) {
                                trail = closer + trail;
                                match = match.slice(0, -1);
                                trimmed = true;
                            }
                        }
                    }
                    const label = _isMapsUrl(match) ? 'Find Location' : match;
                    return '<a href="' + match + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' + trail;
                });

                // Park every anchor behind a token carrying no markdown meaning, so the
                // emphasis/code passes below cannot reach inside an href or its link text.
                var __anchors = [];
                formatted = formatted.replace(/<a href="[^"]*"[^>]*>.*?<\/a>/g, function (match) {
                    __anchors.push(match);
                    return 'L' + (__anchors.length - 1) + '';
                });

                formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                formatted = formatted.replace(/__(.+?)__/g, '<strong>$1</strong>');
                formatted = formatted.replace(/\*(.+?)\*/g, '<em>$1</em>');
                formatted = formatted.replace(/_(.+?)_/g, '<em>$1</em>');
                formatted = formatted.replace(/`(.+?)`/g, '<code>$1</code>');
                formatted = formatted.replace(/\n/g, '<br>');
                formatted = formatted.replace(/^[-*]\s+(.+?)(<br>|$)/gm, '<li>$1</li>');
                formatted = formatted.replace(/(<li>.*?<\/li>)+/gs, '<ul>$&</ul>');

                // Restore the anchors; the Shopify-CDN cleanup below matches real <a> markup.
                formatted = formatted.replace(/L(\d+)/g, function (match, i) {
                    // Emphasis written into link TEXT (e.g. [**Name**](url)) still renders.
                    // Underscore emphasis is skipped when the text IS a URL -- that is the
                    // case this whole block exists to protect.
                    return __anchors[Number(i)].replace(/(>)([^<]*)(<\/a>)/, function (m, gt, text, close) {
                        text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                                   .replace(/\*(.+?)\*/g, '<em>$1</em>');
                        if (!/^https?:\/\//i.test(text)) {
                            text = text.replace(/__(.+?)__/g, '<strong>$1</strong>')
                                       .replace(/_(.+?)_/g, '<em>$1</em>');
                        }
                        return gt + text + close;
                    });
                });
                formatted = formatted.replace(
                    /<a href="(https?:\/\/[^"]+)" target="_blank" rel="noopener noreferrer">[^<]*<\/a>/g,
                    function(m, url) {
                        return _isMapsUrl(url)
                            ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Find Location</a>'
                            : m;
                    }
                );
                // Do not render Shopify CDN asset links in chat copy at all.
                // These are usually image/file assets and should not appear as
                // duplicate product-name lines in text responses.
                formatted = formatted.replace(
                    /(<br>)?\s*<a href="https?:\/\/cdn\.shopify\.com\/[^"]+" target="_blank" rel="noopener noreferrer">[^<]+<\/a>\s*(?=<br>|$)/gi,
                    ''
                );
                formatted = formatted.replace(
                    /<a href="https?:\/\/cdn\.shopify\.com\/[^"]+" target="_blank" rel="noopener noreferrer">([^<]+)<\/a>/gi,
                    '$1'
                );
                // Final normalization pass for product recommendation blocks:
                // - numbered product rows should not hyperlink the product title
                // - standalone product CTA rows should consistently say "Explore Product"
                // - checkout / payment links are never rewritten
                formatted = formatted.replace(
                    /(\d+\.\s*)<a href="([^"]+)" target="_blank" rel="noopener noreferrer">([^<]+)<\/a>(\s*[-–—]\s*)/g,
                    '$1$3$4'
                );
                formatted = formatted.replace(
                    /(<li>)<a href="([^"]+)" target="_blank" rel="noopener noreferrer">([^<]+)<\/a>(<\/li>)/g,
                    function(m, pre, url, txt, post) {
                        if (!_isProductUrl(url) || _isCheckoutUrl(url)) return m;
                        return pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Explore Product</a>' + post;
                    }
                );
                formatted = formatted.replace(
                    /(<br>)\s*<a href="([^"]+)" target="_blank" rel="noopener noreferrer">([^<]+)<\/a>(?=(<br>|$))/g,
                    function(m, pre, url) {
                        if (!_isProductUrl(url) || _isCheckoutUrl(url)) return m;
                        return pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">Explore Product</a>';
                    }
                );
                
                return formatted;
            }

            function formatSizeChart(text) {
                // Check for measurement labels to identify size charts
                const measurementLabels = ['chest', 'length', 'waist', 'hip', 'shoulder', 'sleeve', 'inseam', 'thigh', 'width', 'height', 'bust', 'underbust', 'overbust', 'cup'];
                const hasProperLabels = measurementLabels.some(label => text.toLowerCase().includes(label));
                
                if (!hasProperLabels) {
                    return null; // Not a size chart
                }
                
                // ═══════════════════════════════════════════════════════════════
                // FORMAT 1: Pipe-delimited table (from LLM)
                // Example:
                // 📏 Sunfire Denim Size Chart (inches):
                // Size | Hip | Thigh | Length
                // 28 | 38 | 23 | 42
                // 30 | 40 | 23.5 | 42
                // ═══════════════════════════════════════════════════════════════
                const pipeTableResult = parsePipeDelimitedTable(text);
                if (pipeTableResult) {
                    return pipeTableResult;
                }
                
                // ═══════════════════════════════════════════════════════════════
                // FORMAT 2: Size X: Label: Value format (legacy)
                // ═══════════════════════════════════════════════════════════════
                const lines = text.split(/\r?\n/);
                const sizeLines = [];
                let titleLines = [];
                let foundFirstSize = false;
                
                for (const line of lines) {
                    const trimmed = line.trim();
                    const isSizeLine = /^\*{0,2}Size\s+\w+\s*:\*{0,2}/i.test(trimmed);
                    
                    if (isSizeLine) {
                        const cleanLine = trimmed.replace(/^\*{1,2}/, '').replace(/\*{1,2}/, '');
                        sizeLines.push(cleanLine);
                        foundFirstSize = true;
                    } else if (!foundFirstSize && trimmed) {
                        titleLines.push(trimmed);
                    }
                }
                
                if (sizeLines.length < 2) {
                    return null;
                }
                
                const allMeasurements = [];
                const sizeData = [];
                
                sizeLines.forEach(line => {
                    const cleanLine = line.replace(/\*{1,2}/g, '');
                    const sizeMatch = cleanLine.match(/^Size\s+(\w+)\s*:\s*(.+)$/i);
                    if (!sizeMatch) return;
                    
                    const size = sizeMatch[1];
                    const measurementStr = sizeMatch[2];
                    const measurements = {};
                    
                    const parts = measurementStr.includes('|') ? measurementStr.split('|') : [measurementStr];
                    
                    parts.forEach(part => {
                        const colonMatch = part.match(/([A-Za-z]+(?:\s*\([^)]+\))?(?:\s+[A-Za-z]+(?:\s*\([^)]+\))?)?)\s*:\s*([\d.]+(?:"|\'|cm|in)?)/i);
                        if (colonMatch) {
                            let label = colonMatch[1].trim().replace(/\s*\([^)]+\)/g, '').trim();
                            const value = colonMatch[2].trim();
                            measurements[label] = value;
                            if (!allMeasurements.includes(label)) {
                                allMeasurements.push(label);
                            }
                        } else {
                            const spaceMatch = part.match(/([A-Za-z]+(?:\s*\([^)]+\))?(?:\s+[A-Za-z]+)?)\s+([\d.]+(?:"|\'|cm|in)?)/i);
                            if (spaceMatch) {
                                let label = spaceMatch[1].trim().replace(/\s*\([^)]+\)/g, '').trim();
                                const value = spaceMatch[2].trim();
                                measurements[label] = value;
                                if (!allMeasurements.includes(label)) {
                                    allMeasurements.push(label);
                                }
                            }
                        }
                    });
                    
                    if (Object.keys(measurements).length > 0) {
                        sizeData.push({ size, measurements });
                    }
                });
                
                if (sizeData.length >= 2 && allMeasurements.length > 0) {
                    let title = titleLines.join(' ').replace(/📏\s*/g, '').replace(/Size\s+in\s+\w+:?\s*/gi, '').replace(/:?\s*$/, '').trim();
                    return buildSizeChartTable(title, sizeData, allMeasurements, text);
                }
                
                return null;
            }
            
            // ═══════════════════════════════════════════════════════════════
            // Parse pipe-delimited tables like:
            // Size | Hip | Thigh | Length
            // 28 | 38 | 23 | 42
            // ═══════════════════════════════════════════════════════════════
            function parsePipeDelimitedTable(text) {
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                const isPipeLine = (line) => line.includes('|');
                const isSeparatorLine = (line) => {
                    const cells = splitPipeCells(line);

            async function init() {
                if ((!config.clientName && !config.clientId && !config.encodedClientId) || !config.apiUrl) {
                    console.error('Missing required config');
                    return;
                }

                sessionId = getSessionId();
                applyClarityContext({
                    layer: 'iframe',
                    channel: 'web_widget',
                    widget_version: widgetVersion,
                    client_identifier: config.clientId || config.encodedClientId || config.clientName || '',
                    client_id: config.clientId || config.encodedClientId || '',
                    client_name: config.clientName || '',
                    hostname: window.location.hostname || '',
                    page_url: window.location.href || '',
                    session_id: sessionId || ''
                }, '__FBW_CLARITY_IFRAME_CONTEXT_SENT__');
                applyFaroContext({
                    layer: 'iframe',
                    channel: 'web_widget',
                    widget_version: widgetVersion,
                    client_identifier: config.clientId || config.encodedClientId || config.clientName || '',
                    client_id: config.clientId || config.encodedClientId || '',
                    client_name: config.clientName || '',
                    hostname: window.location.hostname || '',
                    page_url: window.location.href || '',
                    session_id: sessionId || ''
                }, '__FBW_FARO_IFRAME_CONTEXT_SENT__');
                bindEvents();
                notifyParent({ type: 'fashionbot-ready', sessionId: sessionId || '' });
                await preloadWidgetDynamicConfig();

                if (frameUsesPhoneNudgeUi) {
                    phoneCollected = true;
                    userPhone = null;
                    showChatInterface();
                } else {
                    const storedPhone = getStoredPhone();
                    if (storedPhone) {
                        userPhone = storedPhone;
                    }
                    phoneCollected = true;
                    showChatInterface();
                }
            }

            function getSessionId() {
                const providedSessionId = String(config.sessionId || '').trim();
                if (providedSessionId) {
                    try {
                        localStorage.setItem(getSessionStorageKey(), providedSessionId);
                    } catch (e) {}
                    return providedSessionId;
                }

                let id = localStorage.getItem(getSessionStorageKey());
                if (!id) {
                    id = 'web_' + generateUUID();
                    localStorage.setItem(getSessionStorageKey(), id);
                }
                return id;
            }

            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            // ═══════════════════════════════════════════════════════════════
            // EVENT BINDINGS
            // ═══════════════════════════════════════════════════════════════
            function bindEvents() {
                document.getElementById('close-btn').addEventListener('click', () => {
                    notifyParent({ type: 'fashionbot-close' });
                });

                document.getElementById('start-chat-btn').addEventListener('click', startChat);
                document.getElementById('skip-phone-btn').addEventListener('click', skipPhone);
                
                document.getElementById('input-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    sendMessage();
                });

                const messagesDiv = document.getElementById('messages');
                if (messagesDiv) {
                    messagesDiv.addEventListener('click', handleChatLinkClick);
                }

                document.getElementById('context-close').addEventListener('click', () => {
                    document.getElementById('context-banner').classList.remove('show');
                });

                // Listen for parent messages
                window.addEventListener('message', handleParentMessage);
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') {
                        clearReconnectTimer();
                        reconnectPendingUntilVisible = !!(ws && ws.readyState !== WebSocket.OPEN);
                        return;
                    }
                    reconnectIfUseful('visibilitychange');
                });
                window.addEventListener('online', handleBrowserOnline);
                window.addEventListener('offline', () => {
                    clearReconnectTimer();
                    reconnectPendingUntilVisible = true;
                    markRecoveryNoticePending();
                    setConnectionStatus('offline', { toast: true });
                });
                
                // Request bot_ref from parent for URL decoration
                if (window.parent) {
                    window.parent.postMessage({ type: 'fashionbot-get-bot-ref' }, '*');
                }

                if (frameUsesPhoneNudgeUi) {
                    const nudgeBtn = document.getElementById('phone-nudge-v9-submit');
                    const nudgeInput = document.getElementById('phone-nudge-v9-input');
                    if (nudgeBtn && nudgeInput) {
                        nudgeBtn.addEventListener('click', () => {
                            const raw = (nudgeInput.value || '').trim();
                            window.parent.postMessage({ type: 'fashionbot-submit-phone', phone: raw }, '*');
                        });
                        nudgeInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                nudgeBtn.click();
                            }
                        });
                    }
                }
            }

            function handleParentMessage(event) {
                const data = event.data;
                if (!data || !data.type) return;

                switch (data.type) {
                    case 'panel-opened':
                        if (socketDeferredForPrewarm) {
                            socketDeferredForPrewarm = false;
                            if (!ws || ws.readyState !== WebSocket.OPEN) connect();
                        }
                        break;
                    case 'opened':
                        document.getElementById('message-input').focus();
                        if (data.pageContext) {
                            updatePageContext(data.pageContext);
                        }
                        reconnectIfUseful('opened');
                        break;
                    case 'pageContext':
                        updatePageContext(data.context || {});
                        if (typeof data.phoneBlocked === 'boolean') {
                            phoneCollectionBlockedV9 = data.phoneBlocked;
                            const input = document.getElementById('message-input');
                            if (input) input.disabled = phoneCollectionBlockedV9;
                        }
                        break;
                    case 'CART_UPDATED':
                        handleCartUpdate(data.payload, { forceRender: !!data.forceRender });
                        break;
                    case 'cart_action_feedback': {
                        const level = (data.level || 'info').toLowerCase();
                        const msg = data.message || '';
                        if (msg) {
                            showToast(msg, level === 'success' ? 'success' : (level === 'error' ? 'error' : 'info'));
                            addMessage(msg, 'bot');
                        }
                        break;
                    }
                    case 'cart_op_error':
                        console.warn('[cart_op_error] action=' + (data.action || '?') + ' error=' + (data.error || '?') + ' diag=' + JSON.stringify(data.diag || {}));
                        try {
                            queueSocketPayload({
                                type: 'cart_op_error',
                                action: data.action || '',
                                variant_id: String(data.variantId || data.variant_id || ''),
                                product_title: data.productTitle || data.product_title || '',
                                error: String(data.error || ''),
                                diag: data.diag || {},
                                timestamp: new Date().toISOString()
                            });
                        } catch (e) {}
                        break;
                    case 'cart_action_record':
                        sendCartContextEvents(data.items || []);
                        break;
                    case 'widget-logo':
                        if (data.logoUrl) {
                            config.logoUrl = data.logoUrl;
                            applyHeaderLogo(data.logoUrl);
                        }
                        break;
                    case 'launcher-avatar-theme':
                        applyHeaderAvatarTheme(data.avatarBackground, data.ringColor);
                        break;
                    case 'widget-window-theme':
                        applyWidgetWindowTheme(data.windowTheme || data.theme || {});
                        break;
                    case 'widget-status-text':
                        applyWidgetStatusText(data.statusText || {});
                        break;
                    case 'bot-ref':
                        // Store bot_ref for URL decoration
                        botRef = data.botRef;
                        console.log('Bot ref received:', botRef);
                        break;
                    case 'show-phone-nudge':
                        showPhoneNudgeV9UI(!!data.blocked);
                        break;
                    case 'phone-validation-error':
                        setPhoneNudgeErrorV9(data.message || 'Invalid phone number.');
                        break;
                    case 'phone-submitted':
                        onPhoneNudgeSubmittedV9(data.phoneNumber);
                        break;
                }
            }
            
            // Helper function to decorate URL with bot_ref
            function decorateUrl(url) {
                if (!url || !botRef) return url;
                
                try {
                    const urlObj = new URL(url, window.location.origin);
                    urlObj.searchParams.set('bot_ref', botRef);
                    return urlObj.toString();
                } catch (e) {
                    // Fallback for relative URLs
                    const separator = url.indexOf('?') === -1 ? '?' : '&';
                    return url + separator + 'bot_ref=' + encodeURIComponent(botRef);
                }
            }

            function isProductNavigationLink(anchor) {
                if (!anchor) return false;
                const rawHref = String(anchor.getAttribute('href') || '').trim();
                if (!rawHref || rawHref === '#') return false;
                const label = String(anchor.textContent || '').trim().toLowerCase();
                if (label === 'explore product' || label === 'view product') return true;
                try {
                    const parsed = new URL(rawHref, window.location.origin);
                    return /\/products\//i.test(parsed.pathname || '');
                } catch (e) {
                    return /\/products\//i.test(rawHref);
                }
            }

            function openProductUrl(url, productData = {}) {
                if (!url || url === '#') return;
                const decoratedUrl = decorateUrl(url);
                notifyParent({
                    type: 'fashionbot-product-clicked',
                    productTitle: productData.title || '',
                    productHandle: productData.handle || '',
                    productPrice: productData.price || '',
                    productUrl: decoratedUrl
                });
                window.open(decoratedUrl, '_blank');
            }

            function handleChatLinkClick(event) {
                const anchor = event.target && event.target.closest ? event.target.closest('a[href]') : null;
                if (!isProductNavigationLink(anchor)) return;
                event.preventDefault();
                openProductUrl(anchor.getAttribute('href'));
            }

            function updatePageContext(context) {
                currentPageContext = context;
                platform = context.platform || 'generic';
                console.log('Page context updated:', context);

                // Show context banner for product pages
                if (context.pageType === 'product' && context.productTitle) {
                    const banner = document.getElementById('context-banner');
                    document.getElementById('context-product-name').textContent = context.productTitle;
                    banner.classList.add('show');
                }

                // Show initial suggestions if chat is open
                if (phoneCollected && !historyRestored) {
                    showContextSuggestions();
                }
            }


            // ═══════════════════════════════════════════════════════════════
            // CART RENDERING (v7)
            // ═══════════════════════════════════════════════════════════════
            let lastCartToken = null;
            let latestCartSnapshot = null;
            let lastCartSnapshotKey = null;

            function buildCartSnapshotPayload(cart) {
                if (!cart) return null;
                const itemsRaw = Array.isArray(cart.items) ? cart.items : [];
                const items = itemsRaw.map((it) => {
                    if (!it || typeof it !== 'object') return null;
                    let selectedOptions = it.selected_options || it.selectedOptions || it.options_with_values || null;
                    if (Array.isArray(selectedOptions)) {
                        const opts = {};
                        selectedOptions.forEach((opt) => {
                            if (opt && opt.name && opt.value) opts[String(opt.name)] = String(opt.value);
                        });
                        selectedOptions = opts;
                    } else if (selectedOptions && typeof selectedOptions !== 'object') {
                        selectedOptions = null;
                    }
                    return {
                        line_id: String(it.line_id || it.key || ''),
                        variant_id: String(it.variant_id || it.variantId || ''),
                        product_id: String(it.product_id || it.productId || ''),
                        product_handle: String(it.product_handle || it.productHandle || it.handle || ''),
                        product_title: String(it.product_title || it.productTitle || it.title || ''),
                        variant_title: String(it.variant_title || it.variantTitle || ''),
                        selected_options: selectedOptions || {},
                        quantity: Number(it.quantity || 0),
                        unit_price: Number(it.unit_price || it.price || 0),
                        line_total: Number(it.line_total || it.line_price || it.final_line_price || 0),
                        image_url: String(it.image_url || it.image || ''),
                        product_url: String(it.product_url || it.url || ''),
                    };
                }).filter((it) => it && (it.variant_id || it.product_title));
                return {
                    token: String(cart.token || ''),
                    items: items,
                    item_count: Number(cart.item_count != null ? cart.item_count : items.length),
                    subtotal: Number(cart.subtotal || cart.total_price || cart.items_subtotal_price || 0),
                    currency: String(cart.currency || ''),
                    updated_at: new Date().toISOString(),
                    last_action: String(cart.last_action || ''),
                    last_action_variant_id: String(cart.last_action_variant_id || ''),
                    last_action_title: String(cart.last_action_title || ''),
                };
            }

            function sendCartSnapshotToBackend(cart) {
                const snapshot = buildCartSnapshotPayload(cart);
                if (!snapshot) return;
                const key = snapshot.token + '_' + snapshot.item_count + '_' + snapshot.subtotal + '_' + snapshot.last_action + '_' + snapshot.last_action_variant_id;
                if (key === lastCartSnapshotKey) return;
                lastCartSnapshotKey = key;
                queueSocketPayload({
                    type: 'cart_snapshot',
                    cart: snapshot,
                    pageContext: currentPageContext || undefined,
                    timestamp: snapshot.updated_at,
                });
            }

            function handleCartUpdate(cart, opts = {}) {
                if (!cart) return;
                latestCartSnapshot = cart;

                // Push to backend for agent context (covers empty-cart case too).
                sendCartSnapshotToBackend(cart);

                if (!cart.items || cart.items.length === 0) return;

                // Avoid duplicate messages for the same cart state if nothing changed
                const cartToken = cart.token + '_' + cart.item_count + '_' + cart.total_price;
                if (cartToken === lastCartToken && !opts.forceRender) return;
                lastCartToken = cartToken;

                console.log('🛒 Rendering cart update:', cart);
                renderCartMessage(cart);
            }

            /**

                if (!skipStorage) {

            function isOnPdpPage() {
                return !!(currentPageContext && currentPageContext.pageType === 'product');
            }

            function createBulkSelectQty(maxQty, defaultQty) {
                const select = document.createElement('select');
                select.className = 'cart-action-form-qty';
                const safeMax = Math.max(1, Math.min(10, parseInt(maxQty, 10) || 1));
                const safeDefault = Math.max(1, Math.min(safeMax, parseInt(defaultQty, 10) || 1));
                for (let i = 1; i <= safeMax; i += 1) {
                    const option = document.createElement('option');
                    option.value = String(i);
                    option.textContent = `Qty ${i}`;
                    if (i === safeDefault) option.selected = true;
                    select.appendChild(option);
                }
                return select;
            }

            function getLatestCarouselSelectionItems() {
                const carousels = Array.from(document.querySelectorAll('.product-carousel'));
                const latestCarousel = carousels.length ? carousels[carousels.length - 1] : null;
                if (!latestCarousel) return [];
                const cards = Array.from(latestCarousel.querySelectorAll('.product-card'));
                return cards.map((card) => {
                    const addBtn = card.querySelector('.product-card-btn.add-cart');
                    const productUrl = card.dataset.productUrl || '';
                    return {
                        title: card.dataset.productTitle || '',
                        handle: card.dataset.productHandle || addBtn?.getAttribute('data-handle') || extractProductHandle(productUrl) || '',
                        variantId: addBtn?.getAttribute('data-variant') || card.dataset.productVariantId || '',
                        price: card.dataset.productPrice || '',
                        url: productUrl,
                        productImage: card.dataset.productImage || '',
                    };
                }).filter(item => !!item.title);
            }

            function removeExistingCartActionForms() {
                const messagesDiv = document.getElementById('messages');
                const existing = messagesDiv.querySelectorAll('.cart-selection-panel');
                existing.forEach(el => el.remove());
            }

            async function executeBulkAddFromForm(selections) {
                const batchItems = [];
                let successCount = 0;
                let failCount = 0;
                for (const selected of selections) {
                    const finalVariantId = parseInt(normalizeVariantId(selected.variantId), 10);
                    if (!finalVariantId) {
                        failCount += 1;
                        continue;
                    }
                    batchItems.push({
                        variantId: finalVariantId,
                        quantity: selected.quantity,
                        handle: selected.handle || '',
                        productTitle: selected.title || '',
                        productPrice: selected.price || '',
                        productUrl: selected.url || '',
                        productImage: selected.productImage || '',
                        variantTitle: selected.variantTitle || '',
                        optionSummary: selected.optionSummary || '',
                        selectedOptions: Array.isArray(selected.selectedOptions) ? selected.selectedOptions : []
                    });
                    successCount += 1;
                }
                if (batchItems.length) {
                    notifyParent({
                        type: 'fashionbot-add-to-cart-bulk',
                        items: batchItems
                    });
                }
                if (successCount > 0) {
                    showToast(successCount === 1 ? 'Adding 1 product to cart...' : `Adding ${successCount} products to cart...`, 'info');
                }
                if (successCount === 0 && failCount > 0) {
                    showToast('Could not add selected products because variant ID is missing in carousel data.', 'error');
                } else if (failCount > 0) {
                    showToast(`${failCount} selected product(s) skipped due to missing variant ID`, 'info');
                }
            }

            async function hydrateAddFormVariantSelect(rowData, selectEl, metaEl) {
                if (!selectEl || !rowData) return;
                const fallbackSummary = rowData.optionSummary || rowData.variantTitle || '';
                selectEl.innerHTML = '<option value="">Loading…</option>';
                selectEl.disabled = true;
                try {
                    const productInfo = await loadProductVariantData(rowData.handle, rowData.url, rowData);
                    const variants = productInfo && Array.isArray(productInfo.variants)
                        ? productInfo.variants.filter(variant => variant.available)
                        : [];
                    if (!variants.length) {
                        selectEl.innerHTML = '<option value="">Unavailable</option>';
                        if (metaEl) metaEl.textContent = 'Variant options are unavailable for this product.';
                        return;
                    }
                    const defaultVariant = resolvePreferredVariant(productInfo, rowData.variantId);
                    const placeholder = variants.length > 1 ? '<option value="">Select variant</option>' : '';
                    const optionsHtml = variants.map((variant) => {
                        const label = variant.optionSummary || variant.title || 'Default';
                        const isSelected = defaultVariant && variant.id === defaultVariant.id;
                        return `<option value="${escapeHtml(variant.id)}" ${isSelected ? 'selected' : ''}>${escapeHtml(label)}</option>`;
                    }).join('');
                    selectEl.innerHTML = `${placeholder}${optionsHtml}`;
                    selectEl.disabled = false;
                    if (defaultVariant) {
                        rowData.variantId = defaultVariant.id;
                        rowData.variantTitle = defaultVariant.optionSummary || defaultVariant.title || '';
                        rowData.optionSummary = defaultVariant.optionSummary || defaultVariant.title || '';
                        rowData.selectedOptions = defaultVariant.selectedOptions || [];
                    }
                    if (metaEl) {
                        const optionNames = Array.isArray(productInfo.options)
                            ? productInfo.options.map(option => option.name).filter(Boolean).join(' / ')
                            : '';
                        metaEl.textContent = optionNames ? `Select ${optionNames}` : 'Choose the product variant before adding.';
                    }
                    selectEl.addEventListener('change', () => {
                        const chosen = variants.find(variant => variant.id === normalizeVariantId(selectEl.value));
                        if (!chosen) return;
                        rowData.variantId = chosen.id;
                        rowData.variantTitle = chosen.optionSummary || chosen.title || '';
                        rowData.optionSummary = chosen.optionSummary || chosen.title || '';
                        rowData.selectedOptions = chosen.selectedOptions || [];
                    });
                } catch (error) {
                    console.warn('Variant select hydration failed', error);
                    const fallbackVariantId = normalizeVariantId(rowData.variantId);
                    if (fallbackVariantId) {
                        selectEl.innerHTML = `<option value="${escapeHtml(fallbackVariantId)}" selected>${escapeHtml(fallbackSummary || 'Default variant')}</option>`;
                        selectEl.disabled = false;
                    } else {
                        selectEl.innerHTML = '<option value="">Unavailable</option>';
                    }
                    if (metaEl && !metaEl.textContent) {
                        metaEl.textContent = 'Could not load variant options right now.';
                    }
                }
            }

            function executeBulkRemoveFromForm(selections) {
                let removeAllCount = 0;
                let updateCount = 0;
                selections.forEach((selected) => {
                    const currentQty = Math.max(1, parseInt(selected.currentQuantity, 10) || 1);
                    const removeQty = Math.max(1, parseInt(selected.quantity, 10) || currentQty);
                    if (removeQty >= currentQty) {
                        notifyParent({
                            type: 'fashionbot-remove-from-cart',
                            variantId: selected.variantId,
                            productTitle: selected.title || '',
                            targetText: selected.title || '',
                        });
                        removeAllCount += 1;
                        return;
                    }
                    notifyParent({
                        type: 'fashionbot-update-cart-qty',
                        variantId: selected.variantId,
                        productTitle: selected.title || '',
                        targetText: selected.title || '',
                        quantity: currentQty - removeQty,
                        qtyDirection: '',
                    });
                    updateCount += 1;
                });
                if (removeAllCount > 0 || updateCount > 0) {
                    showToast('Updating cart...', 'info');
                }
            }

            function renderCartBulkActionForm(mode, rows) {

                    showToast(mode === 'add' ? 'No recent product list found' : 'Your cart is empty right now.', 'info');

                const messagesDiv = document.getElementById('messages');
                const panel = document.createElement('div');

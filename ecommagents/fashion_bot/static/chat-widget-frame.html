                    const labelWrap = document.createElement('div');
                    labelWrap.className = 'cart-action-form-copy';
                    labelWrap.appendChild(label);

                    const meta = document.createElement('span');
                    meta.className = 'cart-action-form-meta';
                    if (mode === 'add') {
                        meta.textContent = 'Loading variant options…';
                    } else if (row.optionSummary) {
                        meta.textContent = row.optionSummary;
                    }
                    labelWrap.appendChild(meta);

                    const qtySelect = createBulkSelectQty(mode === 'add' ? 5 : row.currentQuantity, row.defaultQuantity);
                    qtySelect.dataset.index = String(index);

                    const controls = document.createElement('div');
                    controls.className = 'cart-action-form-controls';
                    if (mode === 'add') {
                        const variantSelect = document.createElement('select');
                        variantSelect.className = 'cart-action-form-variant';
                        variantSelect.dataset.index = String(index);
                        variantSelect.innerHTML = '<option value="">Loading…</option>';
                        variantSelect.disabled = true;
                        controls.appendChild(variantSelect);
                    }
                    controls.appendChild(qtySelect);

                    rowEl.appendChild(check);
                    rowEl.appendChild(labelWrap);
                    rowEl.appendChild(controls);
                    list.appendChild(rowEl);

                    if (mode === 'add') {
                        const variantSelectEl = controls.querySelector('.cart-action-form-variant');
                        hydrateAddFormVariantSelect(row, variantSelectEl, meta);
                    }
                });
                panel.appendChild(list);

                const actions = document.createElement('div');
                actions.className = 'cart-action-form-actions';

                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'cart-action-form-btn';
                cancelBtn.textContent = 'Cancel';
                cancelBtn.addEventListener('click', () => panel.remove());

                const applyBtn = document.createElement('button');
                applyBtn.type = 'button';
                applyBtn.className = 'cart-action-form-btn primary';
                applyBtn.textContent = mode === 'add' ? 'Add Selected' : 'Remove Selected';
                applyBtn.addEventListener('click', async () => {
                    const checks = Array.from(panel.querySelectorAll('.cart-action-form-check:checked'));
                    if (!checks.length) {
                        showToast('Please select at least one product', 'info');
                        return;
                    }
                    const selections = checks.map((checkEl) => {
                        const idx = parseInt(checkEl.dataset.index, 10);
                        const rowData = rows[idx];
                        const qtyEl = panel.querySelector(`.cart-action-form-qty[data-index="${idx}"]`);
                        const variantEl = panel.querySelector(`.cart-action-form-variant[data-index="${idx}"]`);
                        const selectedVariantId = variantEl ? normalizeVariantId(variantEl.value || rowData.variantId) : normalizeVariantId(rowData.variantId);
                        return {
                            ...rowData,
                            variantId: selectedVariantId,
                            quantity: parseInt(qtyEl && qtyEl.value, 10) || 1
                        };
                    }).filter(Boolean);
                    if (!selections.length) return;
                    applyBtn.disabled = true;
                    if (mode === 'add') {
                        await executeBulkAddFromForm(selections);
                    } else {
                        executeBulkRemoveFromForm(selections);
                    }
                    panel.remove();
                });

                actions.appendChild(cancelBtn);
                actions.appendChild(applyBtn);
                panel.appendChild(actions);

                messagesDiv.appendChild(panel);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                return true;
            }

            function renderAddSelectionFormFromLatestCarousel() {
                const products = getLatestCarouselSelectionItems();
                if (products.length < 2) return false;
                const rows = products.map((product) => ({
                    title: product.title || 'Product',
                    handle: product.handle || '',
                    variantId: product.variantId || '',
                    price: product.price || '',
                    url: product.url || '',
                    productImage: product.productImage || '',
                    defaultQuantity: 1
                }));
                return renderCartBulkActionForm('add', rows);
            }

            function renderRemoveSelectionFormFromCart() {
                if (!latestCartSnapshot || !Array.isArray(latestCartSnapshot.items) || !latestCartSnapshot.items.length) {
                    showToast('Your cart is empty right now.', 'info');
                    return false;
                }
                const rows = latestCartSnapshot.items.map((item) => {
                    const currentQty = Math.max(1, parseInt(item.quantity, 10) || 1);
                    return {
                        title: item.product_title || item.title || 'Product',
                        variantId: item.variant_id || '',
                        currentQuantity: currentQty,
                        defaultQuantity: currentQty
                    };
                });
                return renderCartBulkActionForm('remove', rows);
            }

            function renderCartSelectionPanel(action, opts = {}) {
                if (!latestCartSnapshot || !Array.isArray(latestCartSnapshot.items) || !latestCartSnapshot.items.length) {
                    showToast('Your cart is empty right now.', 'info');
                    return;
                }
                const messagesDiv = document.getElementById('messages');
                const existing = messagesDiv.querySelectorAll('.cart-selection-panel');
                existing.forEach(el => el.remove());

                const panel = document.createElement('div');
                panel.className = 'suggestions-container cart-selection-panel';

                latestCartSnapshot.items.forEach((item, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'suggestion-chip';
                    btn.textContent = `${index + 1}. ${item.product_title || item.title || 'Product'}`;
                    btn.addEventListener('click', () => {
                        panel.remove();
                        if (action === 'remove') {
                            notifyParent({
                                type: 'fashionbot-remove-from-cart',
                                variantId: item.variant_id,
                                productTitle: item.product_title || item.title || '',
                                targetText: item.product_title || item.title || '',
                            });
                            showToast('Removing from cart...', 'info');
                            return;
                        }
                        if (action === 'qty') {
                            notifyParent({
                                type: 'fashionbot-update-cart-qty',
                                variantId: item.variant_id,
                                productTitle: item.product_title || item.title || '',
                                targetText: item.product_title || item.title || '',
                                quantity: opts.quantity,
                                qtyDirection: opts.qtyDirection || '',
                            });
                            if (opts.qtyDirection === 'increase') showToast('Increasing quantity...', 'info');
                            else if (opts.qtyDirection === 'decrease') showToast('Decreasing quantity...', 'info');
                            else showToast(`Updating quantity to ${opts.quantity}...`, 'info');
                        }
                    });
                    panel.appendChild(btn);
                });

                messagesDiv.appendChild(panel);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function saveCartToStorage(cart) {
                try {
                    const storageKey = getMessagesStorageKey();
                    let messages = JSON.parse(localStorage.getItem(storageKey) || '[]');
                    messages.push({
                        type: 'cart',
                        cart: cart,
                        timestamp: new Date().toISOString()
                    });
                    messages = dedupeCartSnapshotsByToken(messages);
                    if (messages.length > CHAT_HISTORY_SAVE_CAP) messages = messages.slice(-CHAT_HISTORY_SAVE_CAP);
                    localStorage.setItem(storageKey, JSON.stringify(messages));
                } catch (e) {}
            }

            // ═══════════════════════════════════════════════════════════════
            // CHAT INITIALIZATION
            // ═══════════════════════════════════════════════════════════════
            function startChat() {
                const phone = document.getElementById('phone-input').value.trim();
                
                if (phone) {
                    if (!/^[0-9]{10,15}$/.test(phone)) {
                        alert('Please enter a valid phone number (10-15 digits)');
                        return;
                    }
                    userPhone = phone;
                    saveStoredPhone(phone);
                }
                
                phoneCollected = true;
                showChatInterface();
            }

            function skipPhone() {
                phoneCollected = true;
                userPhone = null;
                showChatInterface();
            }

            function showChatInterface() {
                document.getElementById('prechat-form').style.display = 'none';
                document.getElementById('messages').style.display = 'block';
                renderAboveChatButtonGroups();
                document.getElementById('input-area').style.display = 'block';
                renderQuickActions();
                
                if (socketDeferredForPrewarm) {
                    // Warmed, not opened: everything above has run, so the panel is
                    // already themed and laid out. The socket waits for the click.
                } else if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connect();
                }

                // Show context-aware suggestions
                showContextSuggestions();
                scheduleHistoryRestore();

                setTimeout(() => document.getElementById('message-input').focus(), 100);
            }

            // ═══════════════════════════════════════════════════════════════
            // SMART SUGGESTIONS
            // ═══════════════════════════════════════════════════════════════
            function showContextSuggestions() {
                // Static/context suggestions are shown only for a new session
                // (before the first chat message). After the conversation starts,
                // suggestions come solely from the generic skill node's <B_C_J>
                // "suggestions" block (renderSuggestionTiles).
                if (conversationHasStarted()) return;
                const displayMode = hasAlwaysTopButtons() ? 'always' : (historyRestored ? 'show-with-history' : 'show-at-start');
                let suggestions = SUGGESTIONS.home;
                if (!currentPageContext) {
                    // No context - show generic suggestions
                    addSuggestions(resolveConfiguredButtons('top-buttons', displayMode, suggestions), { displayMode });
                    return;
                }

                const pageType = currentPageContext.pageType || 'home';
                const productType = (currentPageContext.productType || '').toLowerCase();

                switch (pageType) {
                    case 'product':
                        // Get product-specific suggestions
                        let productSuggestions = SUGGESTIONS.product.default;
                        for (const [type, typeSuggestions] of Object.entries(SUGGESTIONS.product)) {
                            if (type !== 'default' && productType.includes(type)) {
                                productSuggestions = typeSuggestions;
                                break;
                            }
                        }
                        suggestions = productSuggestions;
                        break;
                    case 'collection':
                        suggestions = SUGGESTIONS.collection;
                        break;
                    case 'cart':
                        suggestions = SUGGESTIONS.cart;
                        break;
                    default:
                        suggestions = SUGGESTIONS.home;
                }
                addSuggestions(resolveConfiguredButtons('top-buttons', displayMode, suggestions), { displayMode });
            }

            function showPostQuerySuggestions(botMessage) {
                // Disabled: suggestions come only from the generic skill node block.
                return;
                // eslint-disable-next-line no-unreachable
                if (hasAlwaysTopButtons()) {
                    showContextSuggestions();
                    return;
                }
                // Analyze bot message to determine appropriate follow-ups
                const msgLower = botMessage.toLowerCase();
                let suggestions = SUGGESTIONS.postQuery.default;

                if (msgLower.includes('size') || msgLower.includes('fit')) {
                    suggestions = SUGGESTIONS.postQuery.size;
                } else if (msgLower.includes('fabric') || msgLower.includes('material') || msgLower.includes('cotton')) {
                    suggestions = SUGGESTIONS.postQuery.fabric;
                } else if (msgLower.includes('delivery') || msgLower.includes('shipping') || msgLower.includes('arrive')) {
                    suggestions = SUGGESTIONS.postQuery.delivery;
                } else if (msgLower.includes('price') || msgLower.includes('₹') || msgLower.includes('cost')) {
                    suggestions = SUGGESTIONS.postQuery.price;
                }

                addSuggestions(resolveConfiguredButtons('top-buttons', 'post-chat', suggestions), { displayMode: 'post-chat' });
            }

            function addSuggestions(suggestions, options) {
                const messagesDiv = document.getElementById('messages');
                const displayMode = normalizeButtonDisplayMode(options && options.displayMode ? options.displayMode : 'show-at-start');
                
                // Replace only suggestions with the same persistence class.
                // "always" groups should survive message sends and post-chat suggestions.
                const existingSuggestions = messagesDiv.querySelectorAll('.suggestions-container:not(.cart-selection-panel)');
                existingSuggestions.forEach(el => {
                    const existingMode = normalizeButtonDisplayMode(el.getAttribute('data-display-mode') || 'show-at-start');
                    if (displayMode === 'always') {
                        el.remove();
                    } else if (existingMode !== 'always') {
                        el.remove();
                    }
                });

                // Create suggestions container
                const container = document.createElement('div');
                container.className = 'suggestions-container';
                container.setAttribute('data-display-mode', displayMode);

                (suggestions || []).forEach(item => {
                    const suggestion = normalizeSuggestionItem(item);
                    if (!suggestion) return;
                    const chip = document.createElement('button');
                    chip.className = 'suggestion-chip';
                    setButtonContent(chip, item, suggestion.text);
                    applyConfiguredButtonStyle(chip, item && item.style ? item.style : null);
                    chip.addEventListener('click', () => {
                        document.getElementById('message-input').value = suggestion.message;
                        sendMessage();
                        if (displayMode !== 'always') {
                            container.remove();
                        }
                    });
                    container.appendChild(chip);
                });

                if (!container.children.length) return;
                messagesDiv.appendChild(container);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function inferSuggestionActionKind(suggestion) {
                const haystack = [
                    suggestion && suggestion.text ? String(suggestion.text) : '',
                    suggestion && suggestion.message ? String(suggestion.message) : ''
                ].join(' ').toLowerCase();
                if (haystack.includes('track') && haystack.includes('order')) return 'track_order';
                if (haystack.includes('return') || haystack.includes('exchange')) return 'return_exchange';
                if (haystack.includes('contact support') || haystack.includes('support') || haystack.includes('help')) return 'contact_support';
                return null;
            }

            function cleanSuggestionLabel(text) {
                return String(text || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
            }

            function suggestionIconSvg(kind) {
                if (kind === 'track_order') {
                    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3z"/><path d="M14 10h3l4 4v3h-7z"/><circle cx="8" cy="18" r="1.5"/><circle cx="18" cy="18" r="1.5"/></svg>';
                }
                if (kind === 'return_exchange') {
                    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11"/><path d="M15 4l3 3-3 3"/><path d="M17 17H6"/><path d="M9 14l-3 3 3 3"/></svg>';
                }
                if (kind === 'contact_support') {
                    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M5 14v2a2 2 0 0 0 2 2h1v-6H7a2 2 0 0 0-2 2Z"/><path d="M19 14v2a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2Z"/><path d="M12 19v1"/></svg>';
                }
                return '';
            }

            function createSuggestionIconEl(kind) {
                const icon = document.createElement('span');
                icon.className = 'suggestion-chip-icon';
                icon.innerHTML = suggestionIconSvg(kind);
                return icon;
            }

            function createQuickActionVisualEl(action, kind) {
                const image = action && action.image ? action.image : null;
                if (image && image.type !== 'none' && image.url && isHttpImageUrl(image.url)) {
                    return createButtonVisualEl(action, '', cleanSuggestionLabel(action && action.text)) || null;
                }
                const emoji = String((action && action.emoji) || '').trim();
                if (emoji) {
                    const span = document.createElement('span');
                    span.textContent = emoji;
                    span.setAttribute('aria-hidden', 'true');
                    return span;
                }
                return createButtonVisualEl(action, '', cleanSuggestionLabel(action && action.text)) || null;
            }

            function renderQuickActions() {
                const panel = document.getElementById('quick-actions-panel');
                const grid = document.getElementById('quick-actions-grid');
                if (!panel || !grid) return;
                grid.innerHTML = '';
                const actions = getBaseQuickActions();
                (actions || []).forEach(action => {
                    const kind = inferSuggestionActionKind(action);
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'quick-action-card';
                    applyConfiguredButtonStyle(card, action && action.style ? action.style : null);
                    const badge = document.createElement('span');
                    badge.className = 'quick-action-card-badge';
                    const visual = createQuickActionVisualEl(action, kind);
                    if (visual) {
                        if (visual.tagName === 'IMG') {
                            visual.style.width = '100%';
                            visual.style.height = '100%';
                            visual.style.borderRadius = 'inherit';
                            visual.style.objectFit = 'cover';
                        }
                        badge.appendChild(visual);
                    } else if (!action || action.isConfigured !== true) {
                        badge.innerHTML = suggestionIconSvg(kind);
                    }
                    const label = document.createElement('span');
                    label.className = 'quick-action-card-label';
                    label.textContent = cleanSuggestionLabel(action.text);
                    if (badge.childNodes.length) {
                        card.appendChild(badge);
                    }
                    card.appendChild(label);
                    applyConfiguredQuickActionChildStyle(card, action && action.style ? action.style : null);
                    card.addEventListener('click', () => {
                        document.getElementById('message-input').value = action.message;
                        sendMessage();
                    });
                    grid.appendChild(card);
                });
                panel.style.display = grid.children.length ? 'block' : 'none';
            }

            // Lightbulb / "idea" icon shown inside every suggestion card.
            function suggestionCardIconSvg() {
                return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.45.96 1.02 1.05 1.7l.05.5h5l.05-.5c.09-.68.45-1.25 1.05-1.7A6 6 0 0 0 12 3z"/></svg>';
            }

            // Render the LLM-guided next-step suggestions (the ONLY source of
            // suggestions — they come from the generic skill node's <B_C_J>
            // "suggestions" block, delivered over the WebSocket 'suggestions'
            // event AFTER the product carousel). Rendered as a labelled,
            // horizontally scrollable row of cards with a lightbulb icon.
            // Idempotent per turn: removes any prior block; clears once one is picked.
            function renderSuggestionTiles(suggestions) {
                const messagesDiv = document.getElementById('messages');
                if (!messagesDiv) return;
                // Clear any previous suggestions (current + legacy markup).
                messagesDiv.querySelectorAll('.suggestions-block, .suggestion-tiles').forEach(el => el.remove());
                if (!Array.isArray(suggestions) || !suggestions.length) return;

                const block = document.createElement('div');
                block.className = 'suggestions-block';

                const title = document.createElement('div');
                title.className = 'suggestions-block-title';
                title.textContent = 'Suggestions';
                block.appendChild(title);

                const scroll = document.createElement('div');
                scroll.className = 'suggestions-scroll';

                suggestions.slice(0, 6).forEach(text => {
                    const label = String(text == null ? '' : text).trim();
                    if (!label) return;
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'suggestion-card';

                    const icon = document.createElement('span');
                    icon.className = 'suggestion-card-icon';
                    icon.innerHTML = suggestionCardIconSvg();
                    card.appendChild(icon);

                    const lbl = document.createElement('span');
                    lbl.className = 'suggestion-card-text';
                    lbl.textContent = cleanSuggestionLabel(label);
                    card.appendChild(lbl);

                    card.addEventListener('click', () => {
                        block.remove();
                        sendMessage(label);
                    });
                    scroll.appendChild(card);
                });

                if (scroll.children.length) {
                    block.appendChild(scroll);
                    messagesDiv.appendChild(block);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }

            function renderAboveChatButtonGroups() {
                const panel = document.getElementById('button-groups-panel');
                const row = document.getElementById('button-groups-row');
                if (!panel || !row) return;
                row.innerHTML = '';
                // After the first chat message, suggestions come only from the LLM
                // block (renderSuggestionTiles); keep static button groups to the
                // new session so they don't compete with LLM suggestions.
                if (conversationHasStarted()) {
                    panel.classList.remove('show');
                    return;
                }
                const groups = getAboveChatButtonGroups().filter(shouldRenderAboveChatGroup);
                groups.forEach(group => {
                    group.buttons.forEach(item => {
                        const suggestion = normalizeSuggestionItem(item);
                        if (!suggestion) return;
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = 'suggestion-chip';
                        setButtonContent(chip, item, suggestion.text);
                        applyConfiguredButtonStyle(chip, item && item.style ? item.style : null);
                        chip.addEventListener('click', () => {
                            document.getElementById('message-input').value = suggestion.message;
                            sendMessage();
                            if (normalizeButtonDisplayMode(group.display_mode) !== 'always') {
                                renderAboveChatButtonGroups();
                            }
                        });
                        row.appendChild(chip);
                    });
                });
                panel.classList.toggle('show', row.children.length > 0);
            }

            // ═══════════════════════════════════════════════════════════════
            // PRODUCT CAROUSEL
            // ═══════════════════════════════════════════════════════════════
            /**
             * Carousel images: the server sends `image_url` from format_product_for_carousel — use it as <img src>.
             * No extra round-trips when that field is present. Other keys are legacy fallbacks only.
             */
            function productCardImageSrc(product) {
                if (!product) return null;
                const normalizeImageUrl = (value) => {
                    const raw = String(value || '').trim();
                    if (!raw) return null;
                    if (/^https?:\/\//i.test(raw)) return raw;
                    if (raw.startsWith('//')) return `https:${raw}`;
                    return null;
                };
                const u = product.image_url;
                const directImage = normalizeImageUrl(u);
                if (directImage) return directImage;
                const productImage = normalizeImageUrl(product.image);
                if (productImage) return productImage;
                const imgs = product.images;
                if (Array.isArray(imgs) && imgs.length) {
                    const z = imgs[0];
                    if (typeof z === 'string') {
                        const normalized = normalizeImageUrl(z);
                        if (normalized) return normalized;
                    }
                    if (z && typeof z === 'object') {
                        const s = z.src || z.url || z.image_url;
                        const normalized = normalizeImageUrl(s);
                        if (normalized) return normalized;
                    }
                }
                const featured = product.featured_image && (product.featured_image.src || product.featured_image.url || product.featured_image);
                const normalizedFeatured = normalizeImageUrl(featured);
                if (normalizedFeatured) return normalizedFeatured;
                return null;
            }

            function normalizeVariantId(value) {
                const raw = String(value || '').trim();
                if (!raw) return '';
                if (/^\d+$/.test(raw)) return raw;
                const gidMatch = raw.match(/ProductVariant\/(\d+)/i);
                if (gidMatch && gidMatch[1]) return gidMatch[1];
                const digitMatch = raw.match(/(\d{6,})/);
                return digitMatch && digitMatch[1] ? digitMatch[1] : '';
            }

            function extractProductHandle(value) {
                const raw = String(value || '').trim();
                if (!raw) return '';
                const match = raw.match(/\/products\/([^/?#]+)/i);
                return match && match[1] ? decodeURIComponent(match[1]) : '';
            }

            function extractProductVariantId(product) {
                if (!product || typeof product !== 'object') return '';
                if (product.variantId) return normalizeVariantId(product.variantId);
                if (product.variant_id) return normalizeVariantId(product.variant_id);
                if (product.variant && product.variant.id) return normalizeVariantId(product.variant.id);
                if (Array.isArray(product.variants) && product.variants.length) {
                    const available = product.variants.find(v => v && v.available);
                    if (available && available.id) return normalizeVariantId(available.id);
                    if (product.variants[0] && product.variants[0].id) return normalizeVariantId(product.variants[0].id);
                }
                const productUrl = String(product.url || product.product_url || product.link || product.product_link || '');
                if (productUrl) {
                    try {
                        const parsed = new URL(productUrl, window.location.origin);
                        const variantFromUrl = parsed.searchParams.get('variant');
                        if (variantFromUrl) return normalizeVariantId(variantFromUrl);
                    } catch (e) {}
                }
                return '';
            }

            function getCurrentProductVariantFallback(handle) {
                if (!currentPageContext || currentPageContext.pageType !== 'product') return '';
                if (!currentPageContext.variant) return '';
                const currentHandle = String(currentPageContext.productHandle || '').trim();
                const cardHandle = String(handle || '').trim();
                if (!currentHandle || !cardHandle) return '';
                if (currentHandle !== cardHandle) return '';
                return normalizeVariantId(currentPageContext.variant);
            }

            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function getQueuedPayload(entry) {
                return entry && entry.payload ? entry.payload : entry;
            }

            function getQueuedAt(entry) {
                return entry && entry.queuedAt ? entry.queuedAt : Date.now();
            }

            function pruneMessageQueue() {
                const now = Date.now();
                messageQueue = messageQueue.filter(entry => {
                    return now - getQueuedAt(entry) <= QUEUED_PAYLOAD_TTL_MS;
                });
                while (messageQueue.length >= MAX_QUEUED_PAYLOADS) {
                    const dropIndex = messageQueue.findIndex(entry => {
                        const payload = getQueuedPayload(entry) || {};
                        return payload.type !== 'message';
                    });
                    if (dropIndex >= 0) {
                        messageQueue.splice(dropIndex, 1);
                    } else {
                        messageQueue.shift();
                    }
                }
            }

            function enqueueSocketPayload(payload) {
                if (!payload) return;
                pruneMessageQueue();
                messageQueue.push({ payload: payload, queuedAt: Date.now() });
            }

            function queueSocketPayload(payload) {
                if (!payload) return;
                if (trySendSocketPayload(payload)) return;
                enqueueSocketPayload(payload);
                reconnectPendingUntilVisible = true;
                reconnectIfUseful('queued_payload');
            }

            function sendCartContextEvents(events) {
                const safeEvents = Array.isArray(events) ? events.filter(Boolean) : [];
                if (!safeEvents.length) return;
                queueSocketPayload({
                    type: 'cart_context',
                    events: safeEvents,
                    pageContext: currentPageContext || undefined,
                    userLocation: userLocation || undefined,
                    clientLocation: userLocation || undefined,
                    timestamp: new Date().toISOString()
                });
            }

            function getStoreHostnameForProduct(handle, productUrl) {
                if (productUrl) {
                    try {
                        const rawUrl = String(productUrl).trim();
                        const isAbsolute = /^https?:\/\//i.test(rawUrl) || rawUrl.startsWith('//');
                        if (isAbsolute) {
                            const parsed = new URL(rawUrl, window.location.origin);
                            if (parsed.hostname && !parsed.hostname.includes('localhost')) return parsed.hostname;
                        }
                    } catch (e) {}
                }
                if (currentPageContext && currentPageContext.hostname && !currentPageContext.hostname.includes('localhost')) {
                    return currentPageContext.hostname;
                }
                if (currentPageContext && currentPageContext.url) {
                    try {
                        const parsedCurrent = new URL(String(currentPageContext.url), window.location.origin);
                        if (parsedCurrent.hostname && !parsedCurrent.hostname.includes('localhost')) return parsedCurrent.hostname;
                    } catch (e) {}
                }
                return '';
            }

            function normalizeSelectedOptions(optionDefs, variant) {
                const optionNames = Array.isArray(optionDefs) ? optionDefs.map((opt, idx) => String((opt && opt.name) || `Option ${idx + 1}`)) : [];
                const rawValues = [variant && variant.option1, variant && variant.option2, variant && variant.option3];
                const selections = [];
                for (let i = 0; i < optionNames.length; i += 1) {
                    const value = rawValues[i];
                    if (!value) continue;
                    selections.push({ name: optionNames[i], value: String(value) });
                }
                return selections;
            }

            function summarizeSelectedOptions(selectedOptions) {
                if (!Array.isArray(selectedOptions)) return '';
                return selectedOptions
                    .map(item => item && item.value ? String(item.value).trim() : '')
                    .filter(Boolean)
                    .join(' / ');
            }

            function normalizeShopifyMoneyValue(value) {
                if (value === null || value === undefined || value === '') return '';
                const numeric = typeof value === 'string'
                    ? parseFloat(String(value).replace(/[^0-9.]/g, ''))
                    : Number(value);
                if (!Number.isFinite(numeric)) return '';
                if (Number.isInteger(numeric) && numeric >= 10000) {
                    return numeric / 100;
                }
                return numeric;
            }

            function isVariantAvailable(variant) {
                if (!variant || typeof variant !== 'object') return false;
                if (typeof variant.available === 'boolean') return variant.available;
                if (typeof variant.availableForSale === 'boolean') return variant.availableForSale;
                if (typeof variant.inventory_quantity === 'number') {
                    if (variant.inventory_quantity > 0) return true;
                    if (String(variant.inventory_policy || '').toLowerCase() === 'continue') return true;
                    return false;
                }
                if (typeof variant.inventoryQuantity === 'number') {
                    if (variant.inventoryQuantity > 0) return true;
                    if (String(variant.inventoryPolicy || '').toLowerCase() === 'continue') return true;
                    return false;
                }
                if (String(variant.inventory_policy || variant.inventoryPolicy || '').toLowerCase() === 'continue') {
                    return true;
                }
                return true;
            }

            function normalizeStorefrontProduct(product, fallbackData = {}) {
                if (!product || typeof product !== 'object') return null;
                const handle = String(product.handle || fallbackData.handle || '').trim();
                if (!handle) return null;
                const options = Array.isArray(product.options)
                    ? product.options.map((opt, idx) => {
                        if (typeof opt === 'string') {
                            return { name: `Option ${idx + 1}`, values: [opt] };
                        }
                        return {
                            name: String((opt && opt.name) || `Option ${idx + 1}`),
                            values: Array.isArray(opt && opt.values) ? opt.values.map(v => String(v)) : []
                        };
                    })
                    : [];
                const fallbackImage = productCardImageSrc(product) || fallbackData.productImage || fallbackData.image || '';
                const variants = Array.isArray(product.variants) ? product.variants.map((variant) => {
                    const selectedOptions = normalizeSelectedOptions(options, variant);
                    const optionSummary = summarizeSelectedOptions(selectedOptions);
                    const variantImage = (variant && variant.featured_image && (variant.featured_image.src || variant.featured_image.url))
                        || fallbackImage;
                    return {
                        id: normalizeVariantId(variant && variant.id),
                        title: String((variant && variant.title) || optionSummary || 'Default'),
                        optionSummary: optionSummary || String((variant && variant.title) || ''),
                        available: isVariantAvailable(variant),
                        price: variant && variant.price != null
                            ? normalizeShopifyMoneyValue(variant.price)
                            : normalizeShopifyMoneyValue(product.price || fallbackData.price || ''),
                        image: variantImage,
                        selectedOptions: selectedOptions
                    };
                }).filter(variant => !!variant.id) : [];
                return {
                    handle: handle,
                    title: String(product.title || product.name || fallbackData.title || 'Product'),
                    image: fallbackImage,
                    url: String(product.url || fallbackData.url || ''),
                    options: options,
                    variants: variants
                };
            }

            // Carousel rendering seeds this cache from the chat payload so the
            // first paint needs no network. That seed is a search-index snapshot,
            // not Shopify — it can lag a restock — so it is marked `provisional`
            // and revalidated against the storefront before anyone is shown a
            // size grid. Without this, an index that says "M sold out" strikes M
            // out for every customer with no way to self-correct.
            async function loadProductVariantData(handle, productUrl, fallbackData = {}) {
                const safeHandle = String(handle || '').trim();
                if (!safeHandle) return null;
                const host = getStoreHostnameForProduct(safeHandle, productUrl);
                if (!host) return null;
                const cacheKey = `${host}::${safeHandle}`;
                const cached = productVariantCache[cacheKey];
                if (cached && !cached.provisional) return cached;
                try {
                    const response = await fetchWithTimeout(`https://${host}/products/${encodeURIComponent(safeHandle)}.js`, {}, STOREFRONT_FETCH_TIMEOUT_MS);
                    if (!response.ok) throw new Error('Product not found');
                    const data = await response.json();
                    const normalized = normalizeStorefrontProduct(data.product || data, Object.assign({}, fallbackData, { handle: safeHandle, url: productUrl || fallbackData.url || '' }));
                    if (normalized) {
                        productVariantCache[cacheKey] = normalized;
                        return normalized;
                    }
                } catch (error) {
                    // Storefront unreachable (offline, CORS, timeout). A stale
                    // seed still beats no picker at all, and the cart page
                    // revalidates anyway — but never promote it to authoritative.
                    if (cached) {
                        try { console.warn('[FashionBot] Variant revalidation failed, using seeded data', error); } catch (e) {}
                        return cached;
                    }
                    throw error;
                }
                return cached || null;
            }

            function resolvePreferredVariant(productInfo, preferredVariantId) {
                if (!productInfo || !Array.isArray(productInfo.variants) || !productInfo.variants.length) return null;
                const normalizedPreferred = normalizeVariantId(preferredVariantId);
                if (normalizedPreferred) {
                    const exact = productInfo.variants.find(variant => variant.id === normalizedPreferred);
                    if (exact) return exact;
                }
                return productInfo.variants.find(variant => variant.available) || productInfo.variants[0];
            }

            function productNeedsVariantPicker(productInfo) {
                if (!productInfo || !Array.isArray(productInfo.variants)) return false;
                if (productInfo.variants.length > 1) return true;
                return Array.isArray(productInfo.options) && productInfo.options.some(option => Array.isArray(option.values) && option.values.length > 1);
            }

            function findVariantForSelections(productInfo, selectionMap) {
                if (!productInfo || !Array.isArray(productInfo.variants)) return null;
                return productInfo.variants.find((variant) => {
                    if (!variant.available) return false;
                    return variant.selectedOptions.every((item) => selectionMap[item.name] === item.value);
                }) || null;
            }

            function isVariantOptionSelectable(productInfo, optionName, optionValue, selectionMap) {
                if (!productInfo || !Array.isArray(productInfo.variants)) return false;
                return productInfo.variants.some((variant) => {
                    if (!variant.available) return false;
                    let matches = false;
                    for (let i = 0; i < variant.selectedOptions.length; i += 1) {
                        const item = variant.selectedOptions[i];
                        if (item.name === optionName && item.value === optionValue) {
                            matches = true;
                            break;
                        }
                    }
                    if (!matches) return false;
                    return variant.selectedOptions.every((item) => {
                        if (item.name === optionName) return true;
                        if (!selectionMap[item.name]) return true;
                        return selectionMap[item.name] === item.value;
                    });
                });
            }

            function ensureVariantPickerOverlay() {
                if (variantPickerOverlayEl) return variantPickerOverlayEl;
                const overlay = document.createElement('div');
                overlay.className = 'variant-picker-overlay';
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) {
                        closeVariantPicker(null);
                    }
                });
                document.body.appendChild(overlay);
                variantPickerOverlayEl = overlay;
                return overlay;
            }

            function closeVariantPicker(result) {
                if (!variantPickerOverlayEl || !activeVariantPickerState) return;
                variantPickerOverlayEl.classList.remove('open');
                variantPickerOverlayEl.innerHTML = '';
                const resolver = activeVariantPickerState.resolve;
                activeVariantPickerState = null;
                if (typeof resolver === 'function') {
                    resolver(result || null);
                }
            }

            function renderVariantPicker() {
                const overlay = ensureVariantPickerOverlay();
                const state = activeVariantPickerState;
                if (!state) return;
                const productInfo = state.productInfo;
                const selectionMap = state.selectionMap;
                const matchedVariant = findVariantForSelections(productInfo, selectionMap);
                const optionGroupsHtml = productInfo.options.map((option) => {
                    const buttons = option.values.map((value) => {
                        const selected = selectionMap[option.name] === value;
                        const selectable = isVariantOptionSelectable(productInfo, option.name, value, selectionMap);
                        return `
                            <button
                                type="button"
                                class="variant-picker-option-btn${selected ? ' selected' : ''}"
                                data-variant-group="${escapeHtml(option.name)}"
                                data-variant-value="${escapeHtml(value)}"
                                ${selectable ? '' : 'disabled'}
                            >${escapeHtml(value)}</button>
                        `;
                    }).join('');
                    return `
                        <div class="variant-picker-group">
                            <p class="variant-picker-group-title">${escapeHtml(option.name)}</p>
                            <div class="variant-picker-option-grid">${buttons}</div>
                        </div>
                    `;
                }).join('');
                const qtyOptions = [1, 2, 3, 4, 5].map((qty) => `<option value="${qty}" ${qty === state.quantity ? 'selected' : ''}>Qty ${qty}</option>`).join('');
                const selectionSummary = matchedVariant
                    ? (matchedVariant.optionSummary || matchedVariant.title || 'Variant selected')
                    : 'Select the product options to continue';
                const ctaText = matchedVariant
                    ? `Add To Cart - ${escapeHtml(formatPrice(matchedVariant.price))}`
                    : 'Select options to continue';
                overlay.innerHTML = `
                    <div class="variant-picker-panel">
                        <div class="variant-picker-header">
                            <img class="variant-picker-image" src="${escapeHtml(matchedVariant && matchedVariant.image ? matchedVariant.image : productInfo.image || PLACEHOLDER_IMG)}" alt="${escapeHtml(productInfo.title)}">
                            <div class="variant-picker-summary">
                                <p class="variant-picker-title">${escapeHtml(productInfo.title)}</p>
                                <div class="variant-picker-price">${escapeHtml(formatPrice(matchedVariant && matchedVariant.price != null ? matchedVariant.price : state.productData.price || ''))}</div>
                            </div>
                            <button type="button" class="variant-picker-close" aria-label="Close">×</button>
                        </div>
                        <div class="variant-picker-body">
                            ${optionGroupsHtml}
                        </div>
                        <div class="variant-picker-footer">
                            <div class="variant-picker-footer-top">
                                <div class="variant-picker-selection">${escapeHtml(selectionSummary)}</div>
                                <select class="variant-picker-qty">${qtyOptions}</select>
                            </div>
                            <button type="button" class="variant-picker-submit" ${matchedVariant ? '' : 'disabled'}>${ctaText}</button>
                        </div>
                    </div>
                `;
                overlay.classList.add('open');
                overlay.querySelector('.variant-picker-close').addEventListener('click', () => closeVariantPicker(null));
                overlay.querySelector('.variant-picker-qty').addEventListener('change', (event) => {
                    state.quantity = Math.max(1, parseInt(event.target.value, 10) || 1);
                });
                Array.from(overlay.querySelectorAll('[data-variant-group]')).forEach((button) => {
                    button.addEventListener('click', () => {
                        const group = button.getAttribute('data-variant-group');
                        const value = button.getAttribute('data-variant-value');
                        if (!group || !value) return;
                        state.selectionMap[group] = value;
                        renderVariantPicker();
                    });
                });
                overlay.querySelector('.variant-picker-submit').addEventListener('click', () => {
                    const variant = findVariantForSelections(productInfo, state.selectionMap);
                    if (!variant) return;
                    closeVariantPicker({
                        variantId: variant.id,
                        quantity: state.quantity,
                        productData: Object.assign({}, state.productData, {
                            variantTitle: variant.optionSummary || variant.title || '',
                            optionSummary: variant.optionSummary || variant.title || '',
                            selectedOptions: variant.selectedOptions || [],
                            productImage: variant.image || productInfo.image || state.productData.productImage || ''
                        })
                    });
                });
            }

            function openVariantPicker(productInfo, preferredVariantId, buttonEl, productData, quantity) {
                return new Promise((resolve) => {
                    const defaultVariant = resolvePreferredVariant(productInfo, preferredVariantId || getCurrentProductVariantFallback(productInfo.handle));
                    const selectionMap = {};
                    if (defaultVariant && Array.isArray(defaultVariant.selectedOptions)) {
                        defaultVariant.selectedOptions.forEach((item) => {
                            selectionMap[item.name] = item.value;
                        });
                    }
                    activeVariantPickerState = {
                        resolve: resolve,
                        productInfo: productInfo,
                        selectionMap: selectionMap,
                        quantity: Math.max(1, parseInt(quantity, 10) || 1),
                        productData: Object.assign({}, productData || {})
                    };
                    renderVariantPicker();
                });
            }

            function renderProductCarousel(products) {
                const shell = document.createElement('div');
                shell.className = 'product-carousel-shell';
                const carousel = document.createElement('div');
                carousel.className = 'product-carousel';
                shell.appendChild(carousel);

                products.forEach(product => {
                    const card = createProductCard(product);
                    carousel.appendChild(card);

                    if (variantUiEnabled && product.handle && Array.isArray(product.variants) && product.variants.length > 1) {
                        try {
                            const hasRealOptionNames = Array.isArray(product.options) && product.options.length > 0
                                && product.options.some(function(opt) {
                                    var name = (opt && typeof opt === 'object') ? opt.name : (typeof opt === 'string' ? opt : '');
                                    return name && !/^Option\s*\d+$/i.test(name);
                                });
                            if (hasRealOptionNames) {
                                const host = getStoreHostnameForProduct(product.handle, product.url);
                                if (host) {
                                    const normalized = normalizeStorefrontProduct(product, product);
                                    if (normalized) {
                                        // Search-index snapshot: good enough to paint the
                                        // card, not good enough to disable a size button.
                                        normalized.provisional = true;
                                        productVariantCache[host + '::' + product.handle] = normalized;
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    // Last resort: Shopify .json only if payload had no image_url / image / images[]
                    if (!productCardImageSrc(product) && product.handle) {
                        let storeUrl = null;
                        
                        if (product.url) {
                            try {
                                const urlHost = new URL(product.url).hostname;
                                if (urlHost && !urlHost.includes('localhost')) {
                                    storeUrl = urlHost;
                                }
                            } catch (e) {}
                        }
                        
                        if (!storeUrl && currentPageContext?.hostname && !currentPageContext.hostname.includes('localhost')) {
                            storeUrl = currentPageContext.hostname;
                        }
                        
                        if (storeUrl) {
                            fetchProductImage(product.handle, storeUrl, card);
                        } else {
                            console.log('No valid store URL for product:', product.handle, '- product.url:', product.url);
                        }
                    }
                });

                attachProductCarouselControls(shell, carousel);
                return shell;
            }

            function attachProductCarouselControls(shell, carousel) {
                const prev = document.createElement('button');
                const next = document.createElement('button');
                prev.type = 'button';
                next.type = 'button';
                prev.className = 'product-carousel-nav prev hidden';
                next.className = 'product-carousel-nav next hidden';
                prev.setAttribute('aria-label', 'Scroll products left');
                next.setAttribute('aria-label', 'Scroll products right');
                prev.innerHTML = '&#8249;';
                next.innerHTML = '&#8250;';
                shell.appendChild(prev);
                shell.appendChild(next);

                const scrollStep = () => {
                    const card = carousel.querySelector('.product-card');
                    if (!card) return Math.max(160, Math.floor(carousel.clientWidth * 0.75));
                    const styles = window.getComputedStyle(carousel);
                    const gap = parseFloat(styles.columnGap || styles.gap || '0') || 0;
                    return Math.max(120, card.getBoundingClientRect().width + gap);
                };

                const updateControls = () => {
                    const maxScroll = carousel.scrollWidth - carousel.clientWidth;
                    const canScroll = maxScroll > 4;
                    shell.classList.toggle('has-overflow', canScroll);
                    prev.classList.toggle('hidden', !canScroll || carousel.scrollLeft <= 4);
                    next.classList.toggle('hidden', !canScroll || carousel.scrollLeft >= maxScroll - 4);
                };

                prev.addEventListener('click', () => {
                    carousel.scrollBy({ left: -scrollStep(), behavior: 'smooth' });
                });
                next.addEventListener('click', () => {
                    carousel.scrollBy({ left: scrollStep(), behavior: 'smooth' });
                });
                carousel.addEventListener('scroll', updateControls, { passive: true });
                window.addEventListener('resize', updateControls);
                requestAnimationFrame(updateControls);
                setTimeout(updateControls, 350);
            }

            // Fetch product image from Shopify public product endpoint
            async function fetchProductImage(handle, storeUrl, cardElement) {
                if (!handle || !storeUrl) {
                    console.log('fetchProductImage: Missing handle or storeUrl', { handle, storeUrl });
                    return;
                }
                
                const url = `https://${storeUrl}/products/${handle}.js`;
                console.log('Fetching product image from:', url);
                
                try {
                    const response = await fetchWithTimeout(url, {}, STOREFRONT_FETCH_TIMEOUT_MS);
                    if (!response.ok) {
                        console.log('Product fetch failed:', response.status);
                        return;
                    }
                    
                    const data = await response.json();
                    const product = data.product || data;
                    console.log('Product data received:', product?.title);
                    
                    const imageUrl = productCardImageSrc(product);
                    
                    if (imageUrl) {
                        console.log('Setting image URL:', imageUrl);
                        const imgEl = cardElement.querySelector('.product-card-image');
                        if (imgEl) {
                            imgEl.src = imageUrl;
                        }
                    } else {
                        console.log('No image found in product data');
                    }
                    
                    // Also store variant ID for add-to-cart if available
                    const variant = product?.variants?.find(v => isVariantAvailable(v)) || product?.variants?.[0];
                    if (variant) {
                        const addBtn = cardElement.querySelector('.add-cart');
                        if (addBtn && !addBtn.dataset.variant) {
                            addBtn.dataset.variant = variant.id;
                        }
                    }
                } catch (err) {
                    console.error('Error fetching product image:', err);
                }
            }

            // Simple transparent placeholder - CSS will show gradient background
            const PLACEHOLDER_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

            function productCardDiscountBadge(product) {
                // Best-effort discount badge markup; never throws so that a bad
                // discount value can never break product-card rendering.
                try {
                    const pct = Math.round(Number(product && product.discount_pct) || 0);
                    if (pct > 0) {
                        return '<div class="product-card-discount-badge">' + pct + '% OFF</div>';
                    }
                } catch (e) {
                    // swallow — discount badge is non-essential
                }
                return '';
            }

            function productCardRatingHtml(product) {
                // Best-effort rating row; never throws so a bad/missing rating
                // value can never break product-card rendering. Returns ''
                // (no row at all) for a 0-review product -- the backend only
                // sends rating/rating_count when Judge.me has published
                // reviews, so this is also the primary "no reviews" guard.
                try {
                    const rating = Number(product && product.rating);
                    const count = Number(product && product.rating_count);
                    if (!rating || rating <= 0 || !count || count <= 0) return '';
                    const pct = Math.max(0, Math.min(100, (rating / 5) * 100));
                    return '<div class="product-card-rating">' +
                           '<span class="product-card-stars">★★★★★' +
                           '<span class="product-card-stars-fill" style="width:' + pct + '%">★★★★★</span>' +
                           '</span>' +
                           '<span class="product-card-rating-value">' + rating.toFixed(1) + '</span>' +
                           '<span class="product-card-rating-count">(' + count + ')</span>' +
                           '</div>';
                } catch (e) {
                    return '';
                }
            }

            function productCardPriceHtml(product) {
                // Show MRP (strike-through) + final price when there's a genuine
                // markdown; otherwise just the final price. Never throws — always
                // falls back to the plain price so a card can never break.
                try {
                    const finalFmt = formatPrice(product && product.price);
                    const orig = product && product.original_price;
                    if (orig) {
                        const origFmt = formatPrice(orig);
                        if (origFmt && origFmt !== finalFmt) {
                            return '<div class="product-card-price">' +
                                   '<span class="product-card-price-original">' + origFmt + '</span>' +
                                   '<span class="product-card-price-final">' + finalFmt + '</span>' +
                                   '</div>';
                        }
                    }
                    return '<div class="product-card-price">' + finalFmt + '</div>';
                } catch (e) {
                    try { return '<div class="product-card-price">' + formatPrice(product && product.price) + '</div>'; }
                    catch (e2) { return '<div class="product-card-price"></div>'; }
                }
            }

            function createProductCard(product) {
                const card = document.createElement('div');
                card.className = 'product-card';
                const resolvedUrl = product.url || '#';
                const resolvedHandle = product.handle || extractProductHandle(resolvedUrl) || '';

                // Store product data in card for later use
                card.dataset.productTitle = product.title || product.name || 'Product';
                card.dataset.productHandle = resolvedHandle;
                card.dataset.productPrice = formatPrice(product.price);
                card.dataset.productUrl = resolvedUrl;
                const resolvedVariantId = normalizeVariantId(extractProductVariantId(product) || getCurrentProductVariantFallback(resolvedHandle));
                card.dataset.productVariantId = resolvedVariantId;

                const imageUrl = productCardImageSrc(product) || PLACEHOLDER_IMG;
                const title = (product.title || product.name || 'Product').replace(/"/g, '&quot;');
                card.dataset.productImage = imageUrl;

                // Discount badge (rounded %) shown over the product image when on sale.
                // Delegated to its own try/catch helper so it can never break the card.
                let discountBadge = '';
                try {
                    discountBadge = productCardDiscountBadge(product);
                } catch (e) {
                    discountBadge = '';
                }

                card.innerHTML = `
                    <div class="product-card-image-wrapper">
                        ${discountBadge}
                        <img class="product-card-image" src="${imageUrl}" alt="${title}">
                    </div>
                    <div class="product-card-body">
                        <div class="product-card-title" title="${title}">${title}</div>
                        ${productCardRatingHtml(product)}
                        ${productCardPriceHtml(product)}
                        <div class="product-card-actions">
                            <button class="product-card-btn view" data-url="${resolvedUrl}">View</button>
                            <button class="product-card-btn add-cart" data-handle="${resolvedHandle}" data-variant="${resolvedVariantId}">Add to Cart</button>
                        </div>
                    </div>
                `;
                
                // Handle image load error
                const img = card.querySelector('.product-card-image');
                img.onerror = function() {
                    this.style.display = 'none';
                    this.parentElement.style.background = 'linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%)';
                };

                // Open the product page (shared by the View button and the image click)
                const openCardProduct = () => {
                    const url = card.dataset.productUrl;
                    if (url && url !== '#') {
                        openProductUrl(url, {
                            title: card.dataset.productTitle,
                            handle: card.dataset.productHandle,
                            price: card.dataset.productPrice
                        });
                    }
                };

                // View button click - send attribution event to parent and open product page
                card.querySelector('.view').addEventListener('click', openCardProduct);

                // Image click - same behaviour as the View button
                const imageWrapper = card.querySelector('.product-card-image-wrapper');
                if (imageWrapper) imageWrapper.addEventListener('click', openCardProduct);

                // Product name and price click - same behaviour as the View button
                const titleEl = card.querySelector('.product-card-title');
                if (titleEl) titleEl.addEventListener('click', openCardProduct);
                const priceEl = card.querySelector('.product-card-price');
                if (priceEl) priceEl.addEventListener('click', openCardProduct);

                // Add to cart button click
                card.querySelector('.add-cart').addEventListener('click', (e) => {
                    const button = e.currentTarget;
                    const handle = button.dataset.handle;
                    const variantId = button.dataset.variant;
                    // Pass product data for attribution tracking
                    addToCart(handle, variantId, button, {
                        title: card.dataset.productTitle,
                        price: card.dataset.productPrice,
                        url: card.dataset.productUrl,
                        productImage: card.dataset.productImage
                    });
                });

                return card;
            }

            function formatPrice(price) {
                if (price === null || price === undefined) return '';
                
                let numericPrice = 0;
                if (typeof price === 'object') {
                    numericPrice = price.min || price.amount || 0;
                } else if (typeof price === 'string') {
                    if (price.includes('₹')) return price;
                    numericPrice = parseFloat(price.replace(/[^0-9.]/g, ''));
                } else {
                    numericPrice = price;
                }

                // Format with Indian locale for currency symbols and separators
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0
                }).format(numericPrice);
            }

            // ═══════════════════════════════════════════════════════════════
            // SHOPIFY ADD TO CART
            // ═══════════════════════════════════════════════════════════════
            async function addToCart(handle, variantId, buttonEl, productData = {}, quantity = 1, options = {}) {
                let resolvedProductData = Object.assign({}, productData || {});
                let normalizedVariantId = normalizeVariantId(variantId);
                const skipVariantPicker = !!(options && options.skipVariantPicker);
                const forceVariantPicker = !!(options && options.forceVariantPicker);
                const hasVariantId = !!parseInt(normalizedVariantId, 10);

                if (platform !== 'shopify' && !hasVariantId) {
                    showToast('Add to cart only works on Shopify stores', 'error');
                    return;
                }

                try {
                    if (!skipVariantPicker && variantUiEnabled && handle) {
                        const productInfo = await loadProductVariantData(handle, resolvedProductData.url, Object.assign({}, resolvedProductData, { handle }));
                        if (productInfo) {
                            const preferredVariant = resolvePreferredVariant(productInfo, getCurrentProductVariantFallback(handle) || normalizedVariantId);
                            if (forceVariantPicker || productNeedsVariantPicker(productInfo)) {
                                const picked = await openVariantPicker(productInfo, preferredVariant && preferredVariant.id, buttonEl, resolvedProductData, quantity);
                                if (!picked) return;
                                return addToCart(handle, picked.variantId, buttonEl, picked.productData, picked.quantity, { skipVariantPicker: true });
                            }
                            if (preferredVariant) {
                                normalizedVariantId = preferredVariant.id;
                                resolvedProductData = Object.assign({}, resolvedProductData, {
                                    variantTitle: preferredVariant.optionSummary || preferredVariant.title || '',
                                    optionSummary: preferredVariant.optionSummary || preferredVariant.title || '',
                                    selectedOptions: preferredVariant.selectedOptions || [],
                                    productImage: preferredVariant.image || productInfo.image || resolvedProductData.productImage || ''
                                });
                            }
                        }
                    }
                } catch (variantError) {
                    console.warn('Variant UI bootstrap failed, falling back to direct add:', variantError);
                    if (forceVariantPicker && variantUiEnabled) {
                        showToast('Could not load product options right now.', 'error');
                        return;
                    }
                }

                const finalHasVariant = !!parseInt(normalizedVariantId, 10);
                const storeUrl = currentPageContext?.hostname || currentPageContext?.url?.match(/https?:\/\/([^\/]+)/)?.[1];
                if (!storeUrl && !finalHasVariant) {
                    showToast('Store URL not detected', 'error');
                    return;
                }

                buttonEl.disabled = true;
                buttonEl.textContent = '...';

                try {
                    let finalVariantId = normalizedVariantId;
                    if (!finalVariantId && handle) {
                        const response = await fetchWithTimeout(`https://${storeUrl}/products/${handle}.js`, {}, STOREFRONT_FETCH_TIMEOUT_MS);
                        if (!response.ok) throw new Error('Product not found');
                        const data = await response.json();
                        const productInfo = normalizeStorefrontProduct(data.product || data, Object.assign({}, resolvedProductData, { handle }));
                        const variant = resolvePreferredVariant(productInfo, normalizedVariantId);
                        if (!variant) throw new Error('No variant available');
                        finalVariantId = normalizeVariantId(variant.id);
                        resolvedProductData = Object.assign({}, resolvedProductData, {
                            variantTitle: variant.optionSummary || variant.title || '',
                            optionSummary: variant.optionSummary || variant.title || '',
                            selectedOptions: variant.selectedOptions || [],
                            productImage: variant.image || productInfo.image || resolvedProductData.productImage || ''
                        });
                    }

                    if (!finalVariantId) {
                        throw new Error('No variant ID');
                    }

                    notifyParent({
                        type: 'fashionbot-add-to-cart',
                        variantId: finalVariantId,
                        quantity: parseInt(quantity, 10) || 1,
                        handle: handle,
                        productTitle: resolvedProductData.title || '',
                        productPrice: resolvedProductData.price || '',
                        productUrl: resolvedProductData.url || '',
                        productImage: resolvedProductData.productImage || '',
                        variantTitle: resolvedProductData.variantTitle || '',
                        optionSummary: resolvedProductData.optionSummary || '',
                        selectedOptions: resolvedProductData.selectedOptions || []
                    });

                    buttonEl.textContent = '✓';
                    buttonEl.classList.add('added');
                    showToast('Added to cart! 🛒', 'success');
                } catch (error) {
                    console.error('Add to cart error:', error);
                    buttonEl.textContent = 'Add';
                    buttonEl.disabled = false;
                    showToast('Failed to add to cart', 'error');
                }
            }

            // Add current product to cart (from context)
            function addCurrentProductToCart(quantity = 1) {
                if (!currentPageContext || !currentPageContext.productHandle) {
                    showToast('No product selected', 'error');
                    return;
                }

                const handle = currentPageContext.productHandle;
                const variantId = currentPageContext.variant;

                    disabled: false,

                    classList: { add: () => {} }
                }, {

                    price: currentPageContext.productPrice || '',

                }, quantity, { forceVariantPicker: true });

                    return cells.length > 0 && cells.every(cell => /^:?-{2,}:?$/.test(cell));
                };
                const isValidSizeChartHeader = (headers) => {
                    if (!headers || headers.length < 2) return false;
                    return headers.some(h =>
                        /\b(size|hip|thigh|length|waist|chest|shoulder|sleeve|inseam|width|height|bust|underbust|overbust|cup)\b/i.test(h)
                    );
                };

                const tables = [];
                let current = null;
                let pendingTitleLines = [];

                for (const line of lines) {
                    if (isPipeLine(line)) {
                        if (isSeparatorLine(line)) {
                            continue;
                        }

                        const cells = splitPipeCells(line);
                        if (cells.length < 2) {
                            continue;
                        }

                        if (!current) {
                            current = {
                                titleLines: pendingTitleLines,
                                headers: cells,
                                dataRows: [],
                            };
                            pendingTitleLines = [];
                        } else {
                            current.dataRows.push(cells);
                        }
                        continue;
                    }

                    if (current) {
                        if (current.dataRows.length > 0 && isValidSizeChartHeader(current.headers)) {
                            tables.push(current);
                        }
                        current = null;
                    }

                    pendingTitleLines.push(line);
                }

                if (current && current.dataRows.length > 0 && isValidSizeChartHeader(current.headers)) {
                    tables.push(current);
                }

                if (tables.length < 1) {
                    return null;
                }

                let html = '';
                tables.forEach((table, index) => {
                    const title = table.titleLines.join(' ')
                        .replace(/📏\s*/g, '')
                        .replace(/Size Chart.*?:/gi, 'Size Chart')
                        .replace(/:?\s*$/, '')
                        .trim();

                    if (title) {
                        html += `<div class="size-chart-title">${index === 0 ? '📏 ' : ''}${escapeHtmlSimple(title)}</div>`;
                    }

                    html += '<div class="size-chart-table-wrap"><table class="size-chart-table">';
                    html += '<thead><tr>';
                    table.headers.forEach(h => {
                        html += `<th>${escapeHtmlSimple(h)}</th>`;
                    });
                    html += '</tr></thead>';

                    html += '<tbody>';
                    table.dataRows.forEach(row => {
                        html += '<tr>';
                        for (let idx = 0; idx < table.headers.length; idx++) {
                            const cell = row[idx] || '-';
                            if (idx === 0) {
                                html += `<td class="size-cell">${escapeHtmlSimple(cell)}</td>`;
                            } else {
                                html += `<td>${escapeHtmlSimple(cell)}</td>`;
                            }
                        }
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                });

                return html;
            }

            function splitPipeCells(line) {
                return String(line)
                    .replace(/^\s*\|/, '')
                    .replace(/\|\s*$/, '')
                    .split('|')
                    .map(c => c.trim())
                    .filter(c => c);
            }
            
            function escapeHtmlSimple(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }
            
            function buildSizeChartTable(title, sizeData, allMeasurements, originalText) {
                let html = '';
                if (title) {
                    html += `<div class="size-chart-title">${escapeHtmlSimple(title)}</div>`;
                }
                
                html += '<div class="size-chart-table-wrap"><table class="size-chart-table"><thead><tr>';
                html += '<th>Size</th>';
                allMeasurements.forEach(h => {
                    html += `<th>${escapeHtmlSimple(h)}</th>`;
                });
                html += '</tr></thead><tbody>';
                
                sizeData.forEach(row => {
                    html += '<tr>';
                    html += `<td>${escapeHtmlSimple(row.size)}</td>`;
                    allMeasurements.forEach(m => {
                        html += `<td>${escapeHtmlSimple(row.measurements[m] || '-')}</td>`;
                    });
                    html += '</tr>';
                });
                
                html += '</tbody></table></div>';
                
                return html;
            }

            function escapeHtmlSimple(text) {
                return String(text)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function addMessage(text, sender, saveToStorage = true) {
                addMessageToUI(text, sender, saveToStorage);
            }

            function addMessageToUI(text, sender, saveToStorage = true) {
                const messagesDiv = document.getElementById('messages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.innerHTML = formatText(text);
                
                messageDiv.appendChild(contentDiv);
                messagesDiv.appendChild(messageDiv);
                
                if (sender === 'bot') {
                    // A bot reply arrived — disarm the no-reply watchdog.
                    clearNoReplyWatchdog();
                    const typingIndicator = messagesDiv.querySelector('.typing');
                    if (typingIndicator) {
                        if (typingLabelTimeouts.length) {
                            typingLabelTimeouts.forEach(clearTimeout);
                            typingLabelTimeouts = [];
                        }
                        typingIndicator.parentElement.remove();
                    }
                }
                
                if (saveToStorage) {
                    saveMessageToStorage(text, sender);
                }
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // ── No-reply watchdog ───────────────────────────────────────────
            // AGENTS.md UI checklist #14: if a message is sent successfully but
            // the backend never replies WHILE THE SOCKET STAYS OPEN, the
            // "Thinking…/Typing…" indicator must be cleared by a wall-clock
            // timeout with a retry affordance — reconnect logic does not cover a
            // healthy-but-silent socket. The timer is bound to the indicator's
            // lifecycle: armed when it appears, reset on any sign of life, and
            // cleared on every terminal path (reply, error, phone-required,
            // reconnect give-up). Single-instance: arm always clears first.
            function clearNoReplyWatchdog() {
                if (noReplyWatchdogTimer) {
                    clearTimeout(noReplyWatchdogTimer);
                    noReplyWatchdogTimer = null;
                }
            }

            function armNoReplyWatchdog() {
                clearNoReplyWatchdog();
                noReplyWatchdogTimer = setTimeout(onNoReplyTimeout, WS_NO_REPLY_TIMEOUT_MS);
            }

            // Reset the deadline on a sign of life (a streamed token or a tool
            // action label), but only while a turn is actually in flight — never
            // start a fresh timer for a stray late event with no indicator up.
            function pingNoReplyWatchdog() {
                if (!noReplyWatchdogTimer) return;
                const messagesDiv = document.getElementById('messages');
                if (messagesDiv && messagesDiv.querySelector('.typing')) {
                    armNoReplyWatchdog();
                }
            }

            function onNoReplyTimeout() {
                noReplyWatchdogTimer = null;
                const messagesDiv = document.getElementById('messages');
                // Only act if the turn is still visibly pending (indicator up). A
                // streamed reply removes the indicator and clears the timer, so a
                // fire here means the backend truly went silent.
                if (!messagesDiv || !messagesDiv.querySelector('.typing')) return;
                showTyping(false);
                addMessage("Sorry, this is taking longer than usual. Please try sending your message again.", 'bot');
            }

            function showTyping(show) {
                const messagesDiv = document.getElementById('messages');
                let typingIndicator = messagesDiv.querySelector('.typing');

                if (show && !typingIndicator) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message bot';
                    typingIndicator = document.createElement('div');
                    typingIndicator.className = 'typing';
                    typingIndicator.innerHTML = '<span class="typing-dots" aria-hidden="true"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span><span class="typing-label">Thinking</span>';
                    messageDiv.appendChild(typingIndicator);
                    messagesDiv.appendChild(messageDiv);
                    const typingLabel = typingIndicator.querySelector('.typing-label');
                    if (typingLabelTimeouts.length) {
                        typingLabelTimeouts.forEach(clearTimeout);
                        typingLabelTimeouts = [];
                    }
                    typingLabelTimeouts.push(setTimeout(() => {
                        if (!typingLabel || !typingLabel.isConnected) {
                            return;
                        }
                        typingLabel.textContent = 'Looking for the answer';
                    }, 2000));
                    typingLabelTimeouts.push(setTimeout(() => {
                        if (!typingLabel || !typingLabel.isConnected) {
                            return;
                        }
                        typingLabel.textContent = 'Typing your response';
                        typingLabelTimeouts = [];
                    }, 4000));
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    // Indicator just appeared (turn in flight) → arm the watchdog.
                    armNoReplyWatchdog();
                } else if (!show && typingIndicator) {
                    if (typingLabelTimeouts.length) {
                        typingLabelTimeouts.forEach(clearTimeout);
                        typingLabelTimeouts = [];
                    }
                    typingIndicator.parentElement.remove();
                    // Indicator gone → no turn pending, disarm the watchdog.
                    clearNoReplyWatchdog();
                }
            }

            // Render a backend-driven tool action label (e.g. "Searching for
            // products") in the typing indicator, replacing the generic
            // "Looking for the answer" / "Typing your response" progression.
            // Idempotent: cancels the timed generic-label progression (so it
            // can't overwrite the action a moment later) and just sets the latest
            // action text; safe to call repeatedly as successive tools fire.
            //
            // IMPORTANT: this only RELABELS an indicator that already exists (the
            // one showTyping(true) creates on user send). It must NOT create a
            // new indicator — a tool event that arrives with no active indicator
            // (turn already ended, or a duplicate/out-of-order event after the
            // reply streamed) would otherwise spawn a spinner that no later reply
            // clears, leaving it stuck forever.
            function setTypingActionLabel(action) {
                const text = String(action || '').trim();
                if (!text) return;
                const messagesDiv = document.getElementById('messages');
                if (!messagesDiv) return;
                const typingIndicator = messagesDiv.querySelector('.typing');
                if (!typingIndicator) return;
                if (typingLabelTimeouts.length) {
                    typingLabelTimeouts.forEach(clearTimeout);
                    typingLabelTimeouts = [];
                }
                const typingLabel = typingIndicator.querySelector('.typing-label');
                if (typingLabel) typingLabel.textContent = text;
            }

            function notifyParent(message) {
                if (window.parent !== window) {
                    window.parent.postMessage(message, '*');
                }
            }

            function requestPageContext() {
                notifyParent({ type: 'fashionbot-request-context' });
            }

            // Start
            init();
        })();
    </script>
</body>
</html>

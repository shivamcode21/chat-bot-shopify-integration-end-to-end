# Local observability stack for load testing
# Usage: docker compose up -d
#
# Services:
#   - Grafana:          http://localhost:3000  (admin/admin)
#   - Prometheus:       http://localhost:9090
#   - OTel Collector:   localhost:4317 (gRPC), localhost:4318 (HTTP)
#
# The Fashion Bot server should export OTel metrics to localhost:4317.
# Set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 in .env.loadtest

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: loadtest-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # gRPC OTLP receiver
      - "4318:4318"   # HTTP OTLP receiver
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: loadtest-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: loadtest-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/load_test_dashboard.json:/var/lib/grafana/dashboards/load_test_dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
